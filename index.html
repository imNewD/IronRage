<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iron Rage Archive</title>
  <script src="data/wiki-data.js"></script>
  <script src="data/squad-counts.js"></script>
  <script src="data/faction-groups.js"></script>
  <script src="images/overrides/manifest.js"></script>
  <style>
    :root {
      --bg: #141412;
      --side: #191a17;
      --panel: #21221d;
      --panel2: #2a2b25;
      --line: #454238;
      --ink: #f0ece2;
      --muted: #b9b0a2;
      --gold: #d7b15d;
      --gold2: #f1cf83;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Segoe UI", Arial, sans-serif; overflow-x: hidden; }
    html { overflow-x: hidden; }
    html, body, aside, .side-panel, .list, .stat-filter-body { scrollbar-width: none; -ms-overflow-style: none; }
    ::-webkit-scrollbar { width: 0; height: 0; background: transparent; }
    button, input, select { font: inherit; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 320px minmax(0, 1fr); }
    .app.has-side { grid-template-columns: 320px minmax(0, 1fr) minmax(280px, 380px); }
    aside { height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--side); }
    .side-panel { display: none; height: 100vh; position: sticky; top: 0; overflow-y: auto; border-left: 1px solid var(--line); background: var(--side); padding: 16px; overscroll-behavior: contain; }
    .app.has-side .side-panel { display: block; }
    .brand { padding: 18px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .meta, .small { color: var(--muted); font-size: 12px; }
    .search { padding: 14px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); position: relative; }
    .tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .tabs button, .search input, .search select, .row, .card-button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #11120f;
      color: var(--ink);
    }
    .tabs button { padding: 8px 4px; cursor: pointer; background: var(--panel2); }
    .tabs button.active { border-color: var(--gold); color: #ffe0a0; background: #3a301e; }
    .search input, .search select { width: 100%; padding: 9px 10px; outline: none; }
    .query-row { display: flex; gap: 6px; }
    .query-row input { flex: 1; min-width: 0; }
    .stat-filter-control-row { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--line); }
    .stat-filter-control-row .mini-toggle { flex: 1; width: auto; min-width: 0; }
    .mini-toggle, .icon-btn {
      flex: 0 0 auto; width: 36px; height: 36px; border-radius: 6px;
      border: 1px solid var(--line); background: #11120f; color: var(--muted);
      cursor: pointer; font-size: 14px; font-weight: 700; display: flex;
      align-items: center; justify-content: center; padding: 0;
    }
    .mini-toggle:hover, .icon-btn:hover { color: var(--ink); border-color: #6b6656; }
    .mini-toggle.active, .icon-btn.active { border-color: var(--gold); color: #ffe0a0; background: #3a301e; }
    .stat-filter-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 45;
    }
    .stat-filter-panel {
      position: fixed; left: 50%; top: 50%; right: auto; bottom: auto;
      transform: translate(-50%, -50%); margin: 0;
      width: min(420px, 92vw); max-height: 85vh;
      background: var(--panel2); border: 1px solid var(--line);
      border-radius: 12px; z-index: 46;
      display: grid; grid-template-rows: auto 1fr;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6);
    }
    .stat-filter-panel[hidden], .stat-filter-backdrop[hidden] { display: none; }
    .stat-filter-sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-bottom: 1px solid var(--line);
      font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    }
    .stat-filter-close {
      background: none; border: none; color: var(--muted); font-size: 22px; line-height: 1;
      cursor: pointer; padding: 2px 6px;
    }
    .stat-filter-close:hover { color: var(--ink); }
    .stat-filter-body { display: grid; gap: 6px; padding: 8px; overflow-y: auto; }
    .stat-filter-row { display: grid; grid-template-columns: 62px 1fr 1fr; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
    .stat-filter-row input {
      width: 100%; padding: 5px 6px; border-radius: 4px; border: 1px solid var(--line);
      background: #141412; color: #f4efe4; font-size: 12px; outline: none;
    }
    .stat-filter-row input:focus { border-color: var(--gold); }
    .stat-filter-clear-row { display: flex; justify-content: flex-end; }
    .stat-filter-clear-row button {
      border: 1px solid var(--line); border-radius: 5px; background: #11120f; color: var(--muted);
      padding: 5px 10px; font-size: 12px; cursor: pointer;
    }
    .stat-filter-clear-row button:hover { color: var(--ink); border-color: #6b6656; }
    .stat-sort-list { display: grid; gap: 6px; }
    .stat-sort-row { display: grid; grid-template-columns: 62px 32px 32px; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
    .sort-btn {
      border: 1px solid var(--line); border-radius: 4px; background: #11120f; color: var(--muted);
      cursor: pointer; font-size: 12px; padding: 5px 0; line-height: 1;
    }
    .sort-btn:hover { color: var(--ink); border-color: #6b6656; }
    .sort-btn.active { border-color: var(--gold); color: #ffe0a0; background: #3a301e; }
    .stat-sort-clear-row { display: flex; justify-content: flex-end; }
    .stat-category-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; align-items: center; }
    .category-chip {
      font-size: 12px; padding: 4px 9px; border-radius: 999px; border: 1px solid #6b6656;
      background: transparent; color: var(--muted); cursor: pointer;
    }
    .category-chip:hover { color: var(--ink); border-color: #8a8368; }
    .category-chip.active { border-color: var(--gold); color: #ffe0a0; background: #3a301e; }
    .category-clear { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px; }
    .category-clear:hover { color: var(--ink); }
    .registry-book {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      background: linear-gradient(180deg, #2c2415, #22190f);
      border: 1px solid #6b5a34; border-radius: 10px; padding: 20px;
      flex: 1; min-height: 0;
    }
    .registry-wrap { display: flex; flex-direction: column; }
    .registry-page { display: flex; flex-direction: column; gap: 12px; min-height: 0; flex: 1; }
    .registry-page-title { text-align: center; color: #e8cf9a; font-size: 13px; letter-spacing: 0.03em; text-transform: uppercase; }
    .registry-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; flex: 1; min-height: 0; }
    @media (max-width: 700px) { .registry-book { grid-template-columns: 1fr; } .registry-grid { grid-template-columns: repeat(5, 1fr); } }
    .registry-card {
      position: relative; border-radius: 8px; border: 1px solid #8a7440; background: #3a2e18;
      padding: 0; overflow: hidden; cursor: pointer; min-height: 0;
    }
    .registry-card:hover { border-color: var(--gold); z-index: 2; }
    .registry-card img { width: 100%; height: 100%; object-fit: cover; }
    .registry-blank { border-radius: 8px; border: 1px solid #8a7440; background: transparent; cursor: default; }
    .registry-blank:hover { border-color: #8a7440; z-index: 1; }
    .registry-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 12px; color: var(--muted); font-size: 13px; }
    .registry-nav button { background: none; border: 1px solid #6b6656; color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    .registry-nav button:disabled { opacity: 0.4; cursor: default; }
    .compare-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: #2a2115; border: 1px solid var(--gold); border-radius: 8px;
      padding: 8px 12px; margin-bottom: 10px; color: var(--gold2); font-size: 13px;
    }
    .compare-banner button { background: none; border: 1px solid #6b6656; color: var(--ink); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    .compare-banner button:hover { border-color: var(--gold); }
    .compare-banner-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .compare-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); z-index: 90;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .compare-modal {
      position: relative; width: min(820px, 100%); max-height: 90vh; overflow-y: auto;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px;
    }
    .compare-modal-close {
      position: absolute; top: 10px; right: 12px; background: none; border: none;
      color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer;
    }
    .compare-modal-close:hover { color: var(--ink); }
    .compare-modal-title { text-align: center; color: var(--gold2); font-size: 13px; letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 16px; }
    .compare-side { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
    .compare-side .combat-portrait-frame { width: 96px; height: 96px; }
    .compare-side strong { font-size: 15px; }
    .compare-abilities { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 4px; }
    .compare-abilities img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line); background: #11120f; cursor: help; }
    /* Two-unit comparison modal: a portrait/name column on each side with a
       center column listing every shared stat as "left value — icon+label —
       right value", color-coded so the winning side stands out. */
    .compare-modal-grid { display: grid; grid-template-columns: minmax(120px, 200px) 1fr minmax(120px, 200px); gap: 18px; align-items: start; }
    .compare-stats-col { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; min-width: 0; }
    .compare-stat-row { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 10px; }
    .compare-stat-val { text-align: center; font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; }
    .compare-stat-val.compare-better { color: #86d97c; }
    .compare-stat-val.compare-worse { color: #e07a72; }
    .compare-stat-label { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
    .compare-stat-label img.stat-icon { width: 18px; height: 18px; }
    @media (max-width: 620px) {
      .compare-modal-grid { grid-template-columns: 1fr; }
      .compare-stats-col { order: 3; padding-top: 4px; }
    }
    /* Combat grid: 50x50px placement/movement board. Team color rings the
       token; a thin bar under it tracks current HP; move/attack options
       highlight as green/red cell backgrounds when a unit is selected. */
    .combat-grid-wrap { padding: 4px 4px 24px; overflow: auto; }
    .combat-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
    .combat-toolbar-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .combat-zoom-controls { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .combat-zoom-btn { padding: 6px 10px; background: #11120f; color: var(--muted); border: none; cursor: pointer; font-size: 13px; font-weight: 700; }
    .combat-zoom-btn:hover { color: var(--ink); background: #1c1c14; }
    .combat-zoom-btn:disabled { opacity: 0.35; cursor: default; }
    .combat-zoom-label { font-size: 11px; color: var(--muted); padding: 0 6px; min-width: 34px; text-align: center; }
    .combat-team-picker { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .combat-team-btn { padding: 6px 12px; font-size: 12px; background: #11120f; color: var(--muted); border: none; cursor: pointer; }
    .combat-team-btn:hover { color: var(--ink); }
    .combat-team-btn.combat-team-blue.active { background: #1c3a5e; color: #bcdcff; }
    .combat-team-btn.combat-team-red.active { background: #5e1c1c; color: #ffc9c9; }
    /* Single team-picker "Start" button: background/text flips blue<->red on click,
       replacing the old two-button Blue/Red picker. */
    .combat-start-btn { padding: 6px 18px; border-radius: 6px; border: 1px solid var(--line); font-weight: 700; cursor: pointer; font-size: 12px; letter-spacing: 0.03em; text-transform: uppercase; }
    .combat-start-btn.combat-team-blue { background: #1c3a5e; color: #bcdcff; }
    .combat-start-btn.combat-team-red { background: #5e1c1c; color: #ffc9c9; }
    .combat-turn-indicator { font-size: 12px; color: var(--muted); padding: 0 4px; }
    .combat-grid-rulers { display: grid; grid-template-columns: 26px max-content; grid-template-rows: 18px max-content; width: max-content; }
    .combat-grid-corner { grid-column: 1; grid-row: 1; }
    .combat-ruler-cols { grid-column: 2; grid-row: 1; display: grid; grid-template-columns: repeat(var(--combat-cols), var(--cell-size)); }
    .combat-ruler-rows { grid-column: 1; grid-row: 2; display: grid; grid-template-rows: repeat(var(--combat-rows), var(--cell-size)); }
    .combat-ruler-cell { display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--muted); }
    .combat-grid { grid-column: 2; grid-row: 2; display: grid; grid-template-columns: repeat(var(--combat-cols), var(--cell-size)); grid-auto-rows: var(--cell-size); width: max-content; border-top: 1px solid var(--line); border-left: 1px solid var(--line); cursor: default; }
    .combat-cell {
      position: relative; width: var(--cell-size); height: var(--cell-size); box-sizing: border-box;
      border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center; background: #14140f;
    }
    .combat-cell:hover { background: #1c1c14; }
    /* Outline-only range ring: each edge cell gets a border only on the sides
       that face out of the range, so the whole selection reads as a single
       outline rather than every cell getting a full 4-sided border. */
    .combat-cell-range-t, .combat-cell-range-r, .combat-cell-range-b, .combat-cell-range-l {
      --range-t: transparent; --range-r: transparent; --range-b: transparent; --range-l: transparent;
      box-shadow:
        inset 0 2px 0 0 var(--range-t),
        inset -2px 0 0 0 var(--range-r),
        inset 0 -2px 0 0 var(--range-b),
        inset 2px 0 0 0 var(--range-l);
    }
    .combat-cell-range-t { --range-t: rgba(74, 144, 217, 0.85); }
    .combat-cell-range-r { --range-r: rgba(74, 144, 217, 0.85); }
    .combat-cell-range-b { --range-b: rgba(74, 144, 217, 0.85); }
    .combat-cell-range-l { --range-l: rgba(74, 144, 217, 0.85); }
    .combat-cell-move { background: #1a2e1a; cursor: pointer; }
    .combat-cell-move:hover { background: #22401f; }
    .combat-cell-attack { background: #3a1616; cursor: crosshair; }
    .combat-cell-attack:hover { background: #4a1a1a; }
    .combat-cell-occupied { cursor: pointer; }
    .combat-cell-selected { box-shadow: inset 0 0 0 2px var(--gold2); }
    /* Per-team spawn point marker, set by clicking an empty square after picking
       a team on the Start button. New units spawn here (spiraling outward to the
       nearest open square if it's occupied) unless dragged onto a specific square. */
    .combat-cell-spawn-blue::after, .combat-cell-spawn-red::after {
      content: ""; position: absolute; inset: 3px; border: 2px dashed; border-radius: 3px; pointer-events: none;
    }
    .combat-cell-spawn-blue::after { border-color: #4a90d9; }
    .combat-cell-spawn-red::after { border-color: #d94a4a; }
    .combat-cell-dragover { outline: 2px dashed var(--gold2); outline-offset: -2px; }
    .combat-squad-badge {
      position: absolute; bottom: 1px; right: 2px; font-size: 9px; font-weight: 700;
      color: var(--gold2); background: rgba(0,0,0,0.6); border-radius: 3px; padding: 0 3px; line-height: 1.4;
      pointer-events: none;
    }
    .combat-token-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; }
    .combat-token { width: 34px; height: 34px; object-fit: cover; border-radius: 4px; border: 2px solid var(--line); background: #090a09; }
    .combat-team-blue .combat-token { border-color: #4a90d9; }
    .combat-team-red .combat-token { border-color: #d94a4a; }
    .combat-hp-track { width: 38px; height: 4px; background: #000; border-radius: 2px; overflow: hidden; }
    .combat-hp-fill { height: 100%; }
    .combat-hp-fill.combat-hp-high { background: #6fc96a; }
    .combat-hp-fill.combat-hp-mid { background: #d9b04a; }
    .combat-hp-fill.combat-hp-low { background: #d94a4a; }
    .combat-float {
      position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
      font-size: 12px; font-weight: 700; pointer-events: none; white-space: nowrap;
      animation: combat-float-up 0.9s ease-out forwards; z-index: 5;
    }
    .combat-float-hit { color: #ff8080; }
    .combat-float-miss { color: var(--muted); }
    .combat-float-kill { color: var(--gold2); }
    @keyframes combat-float-up {
      0% { opacity: 1; top: 4px; }
      100% { opacity: 0; top: -18px; }
    }
    .under-card-actions { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
    .btn-under-card {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line);
      background: #11120f; color: var(--muted); cursor: pointer; font-size: 12px;
    }
    .btn-under-card:hover { color: var(--ink); border-color: var(--gold); }
    .btn-under-card.btn-compare-target { border-color: var(--gold); color: var(--gold2); }
    .btn-under-card.btn-compare-active { border-color: #6b6656; color: var(--muted); cursor: default; }
    .registry-popover {
      position: fixed; z-index: 50; width: 340px; max-width: calc(100vw - 24px);
      background: #171310; border: 1px solid #6b5a34; border-radius: 10px; padding: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5); pointer-events: none;
    }
    .registry-popover .combat-head { grid-template-columns: 56px minmax(0, 1fr); }
    .registry-popover .combat-name strong { font-size: 18px; }
    .registry-popover .combat-portrait-frame { width: 56px; height: 56px; }
    .registry-popover .combat-stats { margin: 6px 0 0; font-size: 14px; gap: 10px; }
    .registry-popover .combat-description { font-size: 13px; max-height: 90px; overflow: hidden; }
    .registry-popover .combat-ability img, .registry-popover .ability-orb { width: 40px; height: 40px; }
    .registry-popover .combat-ability strong { font-size: 14px; }
    .registry-popover .combat-ability p { font-size: 12px; }
    .combat-battle-popover-wrap {
      position: fixed; z-index: 60; display: flex; align-items: stretch; gap: 8px; pointer-events: none;
    }
    .combat-battle-popover {
      width: 320px; max-width: calc(100vw - 60px);
      background: #171310; border: 1px solid #6b5a34; border-radius: 10px; padding: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .combat-battle-popover .combat-head { grid-template-columns: 60px minmax(0, 1fr); }
    .combat-battle-popover .combat-name strong { font-size: 16px; }
    .combat-battle-popover .combat-portrait-frame { width: 60px; height: 60px; }
    .combat-battle-popover .combat-stats { margin: 6px 0 0; font-size: 13px; gap: 8px; }
    .combat-battle-popover .combat-description { font-size: 12px; max-height: 70px; overflow: hidden; }
    .combat-battle-popover .combat-ability img, .combat-battle-popover .ability-orb { width: 36px; height: 36px; }
    .combat-battle-popover .combat-ability strong { font-size: 13px; }
    .combat-battle-popover .combat-ability p { font-size: 11px; }
    .combat-battle-popover .combat-equipment { margin-top: 6px; }
    .combat-battle-popover .equip-slot-btn img { width: 32px; height: 32px; }
    .combat-battle-popover .equip-section-label { font-size: 10px; }
    .combat-battle-bar-col { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; }
    .combat-battle-bar {
      width: 16px; flex: 1; min-height: 60px; border-radius: 6px; background: #201a12;
      border: 1px solid #4a4030; display: flex; flex-direction: column-reverse; overflow: hidden;
    }
    .combat-battle-bar-fill { width: 100%; transition: height .15s ease; }
    .combat-battle-bar-attack .combat-battle-bar-fill { background: #d9544a; }
    .combat-battle-bar-move .combat-battle-bar-fill { background: #6fc96a; }
    .combat-battle-bar-col span { font-size: 10px; color: var(--muted); letter-spacing: .04em; }
    .stat-sort-clear-row button {
      border: 1px solid var(--line); border-radius: 5px; background: #11120f; color: var(--muted);
      padding: 5px 10px; font-size: 12px; cursor: pointer;
    }
    .stat-sort-clear-row button:hover { color: var(--ink); border-color: #6b6656; }
    .advanced-toggle {
      border: 1px solid var(--line); border-radius: 5px; background: #11120f; color: var(--muted);
      padding: 6px 10px; font-size: 12px; cursor: pointer; text-align: left; width: 100%;
    }
    .advanced-toggle:hover { color: var(--ink); border-color: #6b6656; }
    .advanced-filters { display: grid; gap: 8px; margin-top: 2px; padding-top: 8px; border-top: 1px solid var(--line); }
    .advanced-filters[hidden] { display: none; }
    .list { overflow-y: auto; overflow-x: hidden; padding: 8px; flex: 1 1 auto; min-height: 0; overscroll-behavior: contain; }
    .row {

    // Rank-tier math (Base -> Ober -> Master -> Veteran -> Legionnaire). Most troops in
    // the captured data are the Base record only; a handful of lines also have separate
    // unit records for their upgraded ranks (e.g. "Ober-Guardsman", "Guardsman-veteran",
    // "Legionnaire guardsman"). classifyRank() detects those naming patterns so we can:
    //   1) group units into rank families, and
    //   2) look up a unit's own tier within its family.
    // "Rookie" variants (the free starter copy of a unit) are a separate, weaker thing
    // and are deliberately excluded from this ladder for now.
    const RANK_ORDER = ["Base", "Ober", "Master", "Veteran", "Legionnaire"];
    // classifyRank only depends on the name string, but hasRealName(), getBaseUnitName(),
    // and getUnitRankTier() each call it independently — and the unit-list sort
    // comparator calls some of those two or three times PER comparison, across every
    // pairwise comparison in an O(n log n) sort over ~2,260 rows (then again for the
    // grouped re-sort). That's tens of thousands of redundant regex passes over the
    // same names on every render, which is what froze the UI while typing. Cache by
    // name so each distinct name is only ever classified once.
    const CLASSIFY_RANK_CACHE = new Map();
    function classifyRank(name) {
      if (CLASSIFY_RANK_CACHE.has(name)) return CLASSIFY_RANK_CACHE.get(name);
      const result = classifyRankUncached(name);
      CLASSIFY_RANK_CACHE.set(name, result);
      return result;
    }

      // Rows below are real Ober/Master/Veteran/Legionnaire records that the generic

      // "Punisher", ...). Left alone they show up as separate single-unit groups AND

      "ober-betrayer of old reich": { family: "old reich betrayer", tier: "Ober" },

      "legionnaire chastener": { family: "punisher", tier: "Legionnaire" },

      "emper master-stormtrooper": { family: "emper stormtrooper", tier: "Master" },

    function classifyRankUncached(name) {
      if (!name) return null;
      const override = RANK_NAME_OVERRIDES[name.trim().toLowerCase()];
      if (override) return override;
      if (/rookie/i.test(name)) return null;
      let m = name.match(/^Legionnaire[\s-]+(.*)$/i);
      if (m) return { family: m[1].trim().toLowerCase(), tier: "Legionnaire" };
      m = name.match(/^(.*)[\s-]+veteran$/i);
      if (m) return { family: m[1].trim().toLowerCase(), tier: "Veteran" };
      m = name.match(/^Veteran[\s-]+(.*)$/i);
      if (m) return { family: m[1].trim().toLowerCase(), tier: "Veteran" };
      m = name.match(/^Ober[\s-]+(.*)$/i);
      if (m) return { family: m[1].trim().toLowerCase(), tier: "Ober" };
      m = name.match(/^Master[\s-]+(.*)$/i);
      if (m) return { family: m[1].trim().toLowerCase(), tier: "Master" };
      return { family: name.trim().toLowerCase(), tier: "Base" };

    const BAD_RANK_DATA_IDS = new Set(["9080", "9106", "8248", "8249"]);
    const RANK_STAT_OVERRIDES = {
      "old reich opportunist|Master": { HP: 950, Armor: 85, DMG: 200, ACC: 100, Range: 10 },
      "old reich opportunist|Veteran": { HP: 1240, Armor: 90, DMG: 230, ACC: 100, Range: 12 },

      "defector of sand snakes|Veteran": { ACC: 100, Evasion: 90 },
      "defector of sand snakes|Legionnaire": { HP: 1650, DMG: 1400, ACC: 100, Evasion: 95 }
    };
    const RANK_MODELS = {
      "Infantry": { table: INFANTRY_RANK_LINEAR, rangeStep: INFANTRY_RANGE_STEP },
      "Heavy infantry": { table: HEAVY_INFANTRY_RANK_LINEAR, rangeStep: HEAVY_INFANTRY_RANGE_STEP },
      "Stormtroopers": { table: STORMTROOPER_RANK_LINEAR, rangeStep: STORMTROOPER_RANGE_STEP },
      "Special": { table: SPECIAL_RANK_LINEAR, rangeStep: SPECIAL_RANGE_STEP },

    // HP/DMG round to the nearest 10; Range just rounds to a whole number, no cap.
    // Armor / ACC / Evasion are NOT rounded as values — see snapUpgradeStep() below:
    // they only ever move in whole +5 steps between ranks, so their step is what gets
    // snapped, not the resulting number.
    function roundRankStat(stat, value) {
      if (stat === "HP" || stat === "DMG") return Math.round(value / 10) * 10;
      if (stat === "Range") return Math.round(value);
      if (stat === "Armor") return Math.min(99, Math.round(value));
      return Math.round(value); // ACC / Evasion (only reached by callers that don't use the +5 path)
    }
    // Armor, ACC and Evasion upgrade in whole +5 steps or not at all. Checked against
    // IronRage_Tiered_Units.xlsx: between consecutive ranks the recorded steps for these
    // three stats are 0, +5, +10, +15... — a +1/+2/+3/+4 upgrade never happens in the
    // game's own rank lines (the few odd rows in that sheet are 99-cap ACC values and a
    // couple of Old Reich Betrayer / Deserter / Emper Sniper entries, which are real
    // recorded data and are left alone). The linear fits above output fractional
    // steps, so instead of rounding the resulting VALUE we round the STEP to the nearest
    // multiple of 5, and any step that rounds to less than +5 becomes "no upgrade at
    // this rank" (stat stays put). Snapping the step this way also matched the real
    // one-step transitions in that sheet far better than rounding the value did
    // (exact hits: Armor 11->36 of 52, ACC 21->64 of 98, Evasion 10->28 of 46).
    // Armor keeps its 99 ceiling: if a full +5 would pass it, the step shrinks by 5s
    // until it fits, and if not even +5 fits the stat stays put (never a +1..+4 stub).
    // ACC/Evasion stay uncapped, as before.
    const STEP5_STATS = new Set(["Armor", "ACC", "Evasion"]);
    const STEP5_CAPS = { Armor: 99 };
    function snapUpgradeStep(stat, oldVal, rawDelta) {
      let step = Math.round(rawDelta / 5) * 5;
      const cap = STEP5_CAPS[stat];
      while (step >= 5 && cap != null && oldVal + step > cap) step -= 5;
      return step >= 5 ? step : 0;
    }
    function forwardStat5(stat, oldVal, coef) {
      return oldVal + snapUpgradeStep(stat, oldVal, coef[0] * oldVal + coef[1] - oldVal);
    }
    // Backward = "what lower-rank value would forwardStat5() turn into hiVal?". Rather
    // than inverting the line and rounding (which can land on a +1..+4 gap), try the
    // lower value at "no upgrade" and every +5 below hiVal, keep the one(s) that
    // forwardStat5() maps exactly onto hiVal — nearest to the plain linear inverse when
    // several qualify — and fall back to the closest miss. This makes going up then down
    // (or down then up) land back where it started wherever the model allows it.
    function backwardStat5(stat, hiVal, coef) {
      const rawStep = Math.max(0, hiVal - (hiVal - coef[1]) / coef[0]);
      let best = null;
      for (let step = 0; hiVal - step >= 0; step += 5) {
        const err = Math.abs(forwardStat5(stat, hiVal - step, coef) - hiVal);
        const dist = Math.abs(step - rawStep);
        if (!best || err < best.err || (err === best.err && dist < best.dist)) best = { step, err, dist };
      }
      return best ? hiVal - best.step : hiVal;
    }
    function estimateRankStepForward(stats, fromTier, toTier, model) {
      const key = `${fromTier}|${toTier}`;
      const out = { ...stats };
      Object.entries(model.table).forEach(([stat, table]) => {
        const coef = table[key];
        if (out[stat] != null && coef) {
          if (STEP5_STATS.has(stat)) {
            out[stat] = forwardStat5(stat, out[stat], coef);
          } else {
            const computed = roundRankStat(stat, coef[0] * out[stat] + coef[1]);
            // An upgrade should never make a stat worse. If the linear model's
            // coefficients dip below the pre-upgrade value, keep the previous value
            // instead of regressing.
            out[stat] = Math.max(computed, out[stat]);
          }
        }
      });
      if (out.Range != null && model.rangeStep[key] != null) out.Range = roundRankStat("Range", out.Range + model.rangeStep[key]);
      return out;
    }
    function estimateRankStepBackward(stats, fromTier, toTier, model) {
      // fromTier is the higher rank, toTier the lower/adjacent one being solved for.
      const key = `${toTier}|${fromTier}`; // the forward key covering this same gap
      const out = { ...stats };
      Object.entries(model.table).forEach(([stat, table]) => {
        const coef = table[key];
        if (out[stat] != null && coef && coef[0] !== 0) {
          out[stat] = STEP5_STATS.has(stat)
            ? backwardStat5(stat, out[stat], coef)
            : roundRankStat(stat, (out[stat] - coef[1]) / coef[0]);
        }
      });
      if (out.Range != null && model.rangeStep[key] != null) out.Range = roundRankStat("Range", out.Range - model.rangeStep[key]);
      return out;
    }
    // Resolves what a unit's stats should look like at a chosen rank tier: prefers a
    // real recorded sibling unit at every step along the way, and only estimates the
    // gaps that have no recorded data. This is deliberate — some lines (e.g. Skirmisher
    // of the Bloody Barkhan) have DMG that flatlines or even dips at a higher rank
    // instead of climbing, and a blind formula would erase that. `source` on the
    // result tells the UI whether what's shown is confirmed data or an estimate.
    function rankAdjustedBaseStats(unit, targetTier) {
      const own = classifyRank(unit.name) || { family: (unit.name || "").toLowerCase(), tier: "Base" };
      // Default (no simulated tier picked) must resolve to THIS unit's own actual
      // tier, not always "Base" — otherwise every rank sibling in a family (Ober/
      // Master/Veteran/Legionnaire) collapses down to the shared Base-tier numbers
      // whenever the rank-tier simulator hasn't been touched, which is what made
      // grouped units all show identical stats.
      const target = targetTier || own.tier;
      const override = RANK_STAT_OVERRIDES[`${own.family}|${target}`];
      if (target === own.tier) return override
        ? { stats: { ...(unit.stats || {}), ...override }, source: "estimated" }
        : { stats: { ...(unit.stats || {}) }, source: "actual" };
      const ownIdx = RANK_ORDER.indexOf(own.tier);
      const targetIdx = RANK_ORDER.indexOf(target);
      if (ownIdx < 0 || targetIdx < 0) return { stats: { ...(unit.stats || {}) }, source: "actual" };
      const familyEntry = RANK_FAMILY_INDEX.get(own.family) || {};
      const dir = targetIdx > ownIdx ? 1 : -1;
      const model = RANK_MODELS[unit.unit_type_name];
      let running = { ...(unit.stats || {}) };
      let idx = ownIdx;
      let estimated = false;
      while (idx !== targetIdx) {
        const nextIdx = idx + dir;
        const nextTierName = RANK_ORDER[nextIdx];
        const real = familyEntry[nextTierName];
        if (real && !BAD_RANK_DATA_IDS.has(String(real.id)) && real.unit_type_name === unit.unit_type_name && real.stats) {
          running = { ...real.stats };
        } else if (model) {
          running = dir === 1
            ? estimateRankStepForward(running, RANK_ORDER[idx], nextTierName, model)
            : estimateRankStepBackward(running, nextTierName, RANK_ORDER[idx], model);
          estimated = true;
        } else {
          return { stats: { ...(unit.stats || {}) }, source: "unsupported" };
        }
        idx = nextIdx;
      }
      const finalOverride = RANK_STAT_OVERRIDES[`${own.family}|${target}`];
      if (finalOverride) return { stats: { ...running, ...finalOverride }, source: "estimated" };
      return { stats: running, source: estimated ? "estimated" : "actual" };
    }
    function rankTierNote(unit) {

      if (res.source === "actual") return `Confirmed ${tier} stats from captured game data.`;
      return "";

    const STUFF_MODIFIERS_FALLBACK = [

        renderListAndDetail();
      });
      $("list").addEventListener("dragstart", (event) => {
        const btn = event.target.closest(".row");
        if (!btn || !(state.combatMode && state.view === "units")) return;
        const unitId = btn.dataset.id.slice(btn.dataset.id.indexOf(":") + 1);
        event.dataTransfer.setData("text/plain", unitId);
        event.dataTransfer.effectAllowed = "copy";
      });
      render();
    }

    function render() {
      $("section-title").textContent = {units: "Units", support: "Support", equipment: "Equipment", skins: "Unit Skins", assets: "Asset Gallery"}[state.view];
      $("section-meta").textContent = {
        units: "Game-data units with live stat controls.",
        support: "Support entries and hidden values captured from local game data.",
        equipment: "Flattened equipment index, linked back to units.",
        skins: "Recovered skin records from local game data and static game resources.",
        assets: "Every copied image asset from the archive.",
        audit: "Records with missing metadata, malformed stats, missing images, or placeholder status."
      }[state.view];
      renderFilters();
      renderStatFilterPanel();
      renderListAndDetail();
    }

    function statFilterApplies() {
      return state.view === "units" || state.view === "support";
    }

    function promptLevel() {
      const input = window.prompt("Simulate unit level (0-20). Applies training tiers up to this value, clamped to each unit's own max. Leave blank to clear:", state.levelValue != null ? String(state.levelValue) : "");
      if (input === null) return;
      if (input.trim() === "") {
        state.levelValue = null;
      } else {
        const raw = Number(input);
        if (!Number.isFinite(raw)) { alert("Enter a whole number between 0 and 20."); return; }
        state.levelValue = Math.max(0, Math.min(20, Math.round(raw)));
      }
      $("level-toggle").classList.toggle("active", state.levelValue != null);
      $("level-toggle").textContent = state.levelValue != null ? `L:${state.levelValue}` : "L";
      Object.keys(liveState).forEach(id => delete liveState[id]);
      state.selected = null;
      renderListAndDetail();
    }

    function toggleJunkMode() {
      if (state.view !== "units") {
        alert("Junk mode is available in the Units library only.");
        return;
      }
      if (state.junkMode) {
        finishJunkReview();
        return;
      }
      state.junkMode = true;
      state.junkReview = false;
      $("junk-toggle").classList.add("active");
      $("junk-toggle").textContent = "Done";
      renderListAndDetail();
    }

    function toggleJunkSelection(id) {
      if (state.junkSelection.has(id)) state.junkSelection.delete(id);
      else state.junkSelection.add(id);
      renderListAndDetail();
    }

    function finishJunkReview() {
      state.junkMode = false;
      state.junkReview = true;
      $("junk-toggle").classList.remove("active");
      $("junk-toggle").textContent = "JM";
      renderListAndDetail();
    }

    function junkSelectionRows() {
      return [...state.junkSelection].map(key => {
        const id = key.slice(key.indexOf(":") + 1);
        return views.units.find(unit => String(unit.id) === String(id));
      }).filter(Boolean);
    }

    function downloadJunkList() {
      const entries = junkSelectionRows().map(unit => ({
        id: String(unit.id),
        name: unit.name || unit.bio_name || "",
        preview: unit.preview || "",
        icon: unit.icon || "",
        unit_type_name: unit.unit_type_name || ""
      }));
      const blob = new Blob([JSON.stringify(entries, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "junk-units.json";
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function renderJunkReview() {
      const entries = junkSelectionRows();
      const list = entries.length ? entries.map(unit => `<div class="junk-summary-item"><strong>${esc(unit.name || unit.bio_name || "Unnamed unit")}</strong> <span class="meta">ID ${esc(unit.id)}${unit.preview ? ` · ${esc(unit.preview)}` : ""}</span></div>`).join("") : `<div class="empty">No units selected.</div>`;
      $("detail").innerHTML = `<div class="junk-summary"><div><strong>Junk review</strong><div class="meta">${entries.length} unit${entries.length === 1 ? "" : "s"} selected. Nothing has been hidden.</div></div><div class="junk-summary-list">${list}</div><div class="junk-summary-actions"><button type="button" id="junk-download">Download junk-units.json</button><button type="button" id="junk-clear">Clear selection</button></div></div>`;
      $("side-panel").innerHTML = "";
      $("junk-download").addEventListener("click", downloadJunkList);
      $("junk-clear").addEventListener("click", () => { state.junkSelection.clear(); renderListAndDetail(); });
    }

    function promptEquip() {
      const countInput = window.prompt("How many hero equipment slots equipped (0-5)? Leave blank to clear:", state.equipConfig ? String(state.equipConfig.count) : "");
      if (countInput === null) return;
      if (countInput.trim() === "") {
        state.equipConfig = null;
      } else {
        const rawCount = Number(countInput);
        if (!Number.isFinite(rawCount)) { alert("Enter a whole number between 0 and 5."); return; }
        const count = Math.max(0, Math.min(5, Math.round(rawCount)));
        const levelInput = window.prompt("Equipment tier (0-10):", state.equipConfig ? String(state.equipConfig.level) : "0");
        if (levelInput === null) return;
        const rawLevel = Number(levelInput);
        if (!Number.isFinite(rawLevel)) { alert("Enter a whole number between 0 and 10."); return; }
        const level = Math.max(0, Math.min(10, Math.round(rawLevel)));
        state.equipConfig = { count, level };
      }
      $("equip-toggle").classList.toggle("active", !!state.equipConfig);
      $("equip-toggle").textContent = state.equipConfig ? `E:${state.equipConfig.count}/${state.equipConfig.level}` : "E";
      Object.keys(liveState).forEach(id => delete liveState[id]);
      state.selected = null;
      renderListAndDetail();
    }

    // Bulk, list-wide version of computedStats() — that function drives the interactive
    // sliders for whichever single unit is open in the detail panel (liveState-based).
    // This one simulates a chosen level/equipment loadout across every row at once, for
    // the "L" and "E" filters. Same underlying idea (base stats + training + equipment
    // bonuses), kept separate so neither has to fight the other's state.
    function effectiveStats(row) {
      const stats = { ...(state.view === "units" ? rankAdjustedBaseStats(row, null).stats : (row.stats || {})) };
      if (state.levelValue != null) {
        Object.entries(row.training || {}).forEach(([stat, tiers]) => {
          const count = Math.min(state.levelValue, (tiers || []).length);
          const add = (tiers || []).slice(0, count).reduce((sum, value) => sum + Number(value || 0), 0);
          stats[stat] = Number(stats[stat] || 0) + add;
        });
      }
      if (state.equipConfig && (row.equipment_slots || []).length) {
        const slots = row.equipment_slots || [];
        const n = Math.min(state.equipConfig.count, slots.length);
        for (let i = 0; i < n; i++) {
          const options = slots[i].options || [];
          if (!options.length) continue;
          const tierIndex = Math.min(state.equipConfig.level, options.length - 1);
          const item = options[tierIndex];
          Object.entries(item?.bonus || {}).forEach(([rawKey, value]) => {
            const stat = statIdToName[rawKey] || rawKey;
            stats[stat] = Number(stats[stat] || 0) + Number(value || 0);
          });
        }
      }
      return stats;
    }

    function renderStatFilterPanel() {
      const toggle = $("stat-filter-toggle");

      $("level-toggle").style.display = applies ? "" : "none";
      $("junk-toggle").style.display = state.view === "units" ? "" : "none";
      $("equip-toggle").style.display = applies ? "" : "none";
      if (!applies) { panel.hidden = true; backdrop.hidden = true; toggle.classList.remove("active"); return; }
      const sortRows = STAT_FILTER_KEYS.map(stat => `

          <button type="button" class="sort-btn ${state.sortStat === stat && state.sortDir === "desc" ? "active" : ""}" data-sort-stat="${esc(stat)}" data-sort-dir="desc" title="Sort high to low">&#9660;</button>
        </div>`).join("");
      const categoryChips = state.view === "units" ? `
        <div class="stat-category-row">
          ${CATEGORY_CODES.map(c => `<button type="button" class="category-chip ${state.categoryFilters.has(c.code) ? "active" : ""}" data-category="${esc(c.code)}" title="${esc(c.label)}">${esc(c.code)}</button>`).join("")}
          ${state.categoryFilters.size ? `<button type="button" id="category-clear" class="category-clear" title="Clear category filters">&times;</button>` : ""}
        </div>` : "";
      const factionOptions = (typeof FACTION_LIST !== "undefined" ? FACTION_LIST : [])
        .concat([UNCLASSIFIED_FACTION])
        .map(f => `<option value="${esc(f)}" ${state.factionFilter === f ? "selected" : ""}>${esc(f)}</option>`).join("");
      const factionFilterRow = state.view === "units" ? `
        <div class="stat-faction-row" style="display: flex; flex-direction: column; gap: 4px; padding: 8px 0; border-bottom: 1px solid var(--line); margin-bottom: 10px;">
          <span style="color: var(--muted); font-size: 12px;">Faction filter</span>
          <select id="faction-filter" style="width: 100%;">
            <option value="all" ${state.factionFilter === "all" ? "selected" : ""}>All factions</option>
            ${factionOptions}
          </select>
        </div>` : "";
      const advancedRows = STAT_FILTER_KEYS.map(stat => {
        const range = state.statFilters[stat] || {};
        return `<div class="stat-filter-row">
          <span>${esc(niceKey(stat))}</span>
          <input type="number" placeholder="min" data-stat-min="${esc(stat)}" value="${range.min ?? ""}">
          <input type="number" placeholder="max" data-stat-max="${esc(stat)}" value="${range.max ?? ""}">
        </div>`;
      }).join("");
      body.innerHTML = `
        <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; padding: 8px 0; border-bottom: 1px solid var(--line);">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; color: var(--muted); font-size: 12px;">
            <input type="checkbox" id="hide-no-icon-check" ${state.hideNoIcon ? "checked" : ""} style="cursor: pointer;">
            Hide units without images
          </label>
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; color: var(--muted); font-size: 12px;">
            <input type="checkbox" id="soldier-only-check" ${state.soldierOnly ? "checked" : ""} style="cursor: pointer;">
            Soldier only <span class="small">(hides squads, shows individual soldiers)</span>
          </label>
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; color: var(--muted); font-size: 12px;">
            <input type="checkbox" id="squad-only-check" ${state.squadOnly ? "checked" : ""} style="cursor: pointer;">
            Squad only <span class="small">(hides individual soldiers, shows squads)</span>
          </label>
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; color: var(--muted); font-size: 12px;">
            <input type="checkbox" id="hidden-soldiers-check" ${state.hiddenSoldiersOnly ? "checked" : ""} style="cursor: pointer;">
            Hidden soldiers <span class="small">(soldiers not used in any known squad)</span>
          </label>
        </div>
        ${factionFilterRow}
        ${categoryChips}
        <div class="stat-sort-list">${sortRows}</div>
        <div class="stat-sort-clear-row"><button type="button" id="sort-clear">Clear sort</button></div>
        <button type="button" id="advanced-toggle" class="advanced-toggle">${state.advancedOpen ? "Hide" : "Advanced"} — exact min/max values ${state.advancedOpen ? "&#9652;" : "&#9662;"}</button>
        <div class="advanced-filters" id="advanced-filters" ${state.advancedOpen ? "" : "hidden"}>
          ${advancedRows}
          <div class="stat-filter-clear-row"><button type="button" id="stat-filter-clear">Clear exact filters</button></div>
        </div>`;
      // Add hide-no-icon checkbox listener
      const factionFilterSelect = $("faction-filter");
      if (factionFilterSelect) {
        factionFilterSelect.addEventListener("change", () => {
          state.factionFilter = factionFilterSelect.value;
          state.selected = null;
          renderListAndDetail();
        });
      }
      const hideNoIconCheck = $("hide-no-icon-check");
      if (hideNoIconCheck) {
        hideNoIconCheck.addEventListener("change", () => {
          state.hideNoIcon = hideNoIconCheck.checked;
          state.selected = null;
          renderListAndDetail();
        });
      }
      const soldierOnlyCheck = $("soldier-only-check");
      if (soldierOnlyCheck) {
        soldierOnlyCheck.addEventListener("change", () => {
          state.soldierOnly = soldierOnlyCheck.checked;
          state.selected = null;
          renderListAndDetail();
        });
      }
      const squadOnlyCheck = $("squad-only-check");
      if (squadOnlyCheck) {
        squadOnlyCheck.addEventListener("change", () => {
          state.squadOnly = squadOnlyCheck.checked;
          state.selected = null;
          renderListAndDetail();
        });
      }
      const hiddenSoldiersCheck = $("hidden-soldiers-check");
      if (hiddenSoldiersCheck) {
        hiddenSoldiersCheck.addEventListener("change", () => {
          state.hiddenSoldiersOnly = hiddenSoldiersCheck.checked;
          state.selected = null;
          renderListAndDetail();
        });
      }
      body.querySelectorAll(".sort-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const stat = btn.dataset.sortStat;
          const dir = btn.dataset.sortDir;
          if (state.sortStat === stat && state.sortDir === dir) {
            state.sortStat = null;
            state.sortDir = null;
          } else {
            state.sortStat = stat;
            state.sortDir = dir;
          }
          state.selected = null;
          renderStatFilterPanel();
          renderListAndDetail();
        });
      });
      $("sort-clear").addEventListener("click", () => {
        state.sortStat = null;
        state.sortDir = null;
        state.selected = null;
        renderStatFilterPanel();
        renderListAndDetail();
      });
      body.querySelectorAll(".category-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          const code = btn.dataset.category;
          if (state.categoryFilters.has(code)) state.categoryFilters.delete(code);
          else state.categoryFilters.add(code);
          state.selected = null;
          renderStatFilterPanel();
          renderListAndDetail();
        });
      });
      const categoryClearBtn = $("category-clear");
      if (categoryClearBtn) {
        categoryClearBtn.addEventListener("click", () => {
          state.categoryFilters.clear();
          state.selected = null;
          renderStatFilterPanel();
          renderListAndDetail();
        });
      }
      $("advanced-toggle").addEventListener("click", () => {
        state.advancedOpen = !state.advancedOpen;
        renderStatFilterPanel();
      });
      body.querySelectorAll("[data-stat-min], [data-stat-max]").forEach(input => {
        input.addEventListener("input", () => {
          const stat = input.dataset.statMin || input.dataset.statMax;
          const key = input.dataset.statMin ? "min" : "max";
          const value = input.value === "" ? null : Number(input.value);
          state.statFilters[stat] = { ...(state.statFilters[stat] || {}), [key]: value };
          state.selected = null;
          renderListAndDetail();
        });
      });
      $("stat-filter-clear").addEventListener("click", () => {
        state.statFilters = {};
        renderStatFilterPanel();
        state.selected = null;
        renderListAndDetail();
      });
    }

    function statFiltersMatch(row) {
      const stats = effectiveStats(row);
      return Object.entries(state.statFilters).every(([stat, range]) => {
        if (!range || (range.min == null && range.max == null)) return true;
        const value = Number(stats[stat]);
        if (!Number.isFinite(value)) return false;
        if (range.min != null && value < range.min) return false;
        if (range.max != null && value > range.max) return false;
        return true;
      });
    }

    function renderFilters() {
      let options = [`<option value="all">All</option>`];
      if (state.view === "units") {
        options.push(`<option value="junk">Junk only</option>`);
        const rarities = [...new Set(views.units.map(u => u.rarity))].sort((a, b) => Number(a) - Number(b));
        options.push(...rarities.map(r => `<option value="rarity:${esc(r)}">Rarity ${esc(r)} ${esc(rarityNames[r] || "")}</option>`));
        options.push(`<option value="elite">Elite only</option>`);
      } else if (state.view === "assets") {
        const cats = [...new Set(views.assets.map(a => a.category))].sort();
        options.push(...cats.map(c => `<option value="cat:${esc(c)}">${esc(c)}</option>`));
      } else if (state.view === "equipment") {
        const slots = [...new Set(views.equipment.flatMap(e => e.slots || []))].sort((a, b) => Number(a) - Number(b));
        options.push(...slots.map(s => `<option value="slot:${esc(s)}">Slot ${esc(s)}</option>`));
      } else if (state.view === "skins") {
        const rarities = [...new Set(views.skins.map(s => s.rarity).filter(r => r !== undefined && r !== null))].sort((a, b) => Number(a) - Number(b));
        options.push(...rarities.map(r => `<option value="rarity:${esc(r)}">Rarity ${esc(r)} ${esc(rarityNames[r] || "")}</option>`));
      } else if (state.view === "audit") {
        options.push(`<option value="severity:high">High priority</option>`);
        options.push(`<option value="severity:medium">Medium priority</option>`);
        options.push(`<option value="severity:low">Low priority</option>`);
      }
      $("filter").innerHTML = options.join("");
      $("filter").value = state.filter;
    }

    function filteredRows() {
      let rows = views[state.view].filter(row => {
        if (state.query) {
          const haystack = state.nameOnly ? titleOf(row).toLowerCase() : textOf(row);
          if (!haystack.includes(state.query)) return false;
        }
        if (state.filter === "elite" && !(Number(row.elite || 0) > 0)) return false;
        if (state.filter === "junk" && !isJunkUnit(row)) return false;
        if (state.filter.startsWith("rarity:") && String(row.rarity) !== state.filter.slice(7)) return false;
        if (state.filter.startsWith("cat:") && row.category !== state.filter.slice(4)) return false;
        if (state.filter.startsWith("slot:") && !(row.slots || []).includes(state.filter.slice(5))) return false;
        if (state.filter.startsWith("severity:") && row.severity !== state.filter.slice(9)) return false;
        if (state.view === "units" && state.categoryFilters.size && !state.categoryFilters.has(unitCategoryCode(row))) return false;
        if (state.view === "units" && state.factionFilter !== "all" && unitFaction(row) !== state.factionFilter) return false;
        if (state.view === "units" && state.soldierOnly && !row._soldierEntry) return false;
        if (state.view === "units" && state.squadOnly && row._soldierEntry) return false;
        if (state.view === "units" && state.hiddenSoldiersOnly && !(row._soldierEntry && row._unusedSoldier)) return false;
        // Soldier entries never had a verified icon path captured (see SOLDIER_ROWS
        // above) — their guessed URLs mostly 404. Applying the broken-icon check to
        // them too would make "Soldier only" show ~nothing and make "Squad only"
        // look like it does nothing (since soldiers were already filtered out by the
        // icon check by default), which is exactly backwards from what the toggle is
        // for. So icon-based hiding only applies to squads/regular units here.
        // Checks both the raw data icon AND any local override (images/overrides/,
        // via overrideManifest) — otherwise a unit with a working overridden image
        // still gets treated as "no image" here, since this used to only look at
        // row.icon, which the override never touches.
        if (state.view === "units" && state.hideNoIcon && !row._soldierEntry && !overrideManifest[String(row.id)] && (!(row.icon && row.icon.trim()) || brokenIconIds.has(row.id))) return false;
        if (statFilterApplies() && state.equipConfig && !(row.equipment_slots || []).length) return false;
        if (statFilterApplies() && !statFiltersMatch(row)) return false;
        return true;
      });
      if (statFilterApplies() && state.sortStat) {
        const factor = state.sortDir === "asc" ? 1 : -1;
        rows = rows.slice().sort((a, b) => (Number(effectiveStats(a)[state.sortStat] || 0) - Number(effectiveStats(b)[state.sortStat] || 0)) * factor);
      } else if (state.view === "units") {
        // Sort by typeOrder, base name, and rank tier when not using stat sorting
        rows = rows.slice().sort((a, b) => {
          const indexA = typeOrderIndex(a.unit_type_name);
          const indexB = typeOrderIndex(b.unit_type_name);
          
          // First sort by type
          if (indexA !== indexB) {
            if (indexA === -1) return 1;
            if (indexB === -1) return -1;
            return indexA - indexB;
          }
          
          // Then sort by whether unit has a real name (real names first)
          const hasRealA = hasRealName(a);
          const hasRealB = hasRealName(b);
          if (hasRealA !== hasRealB) return hasRealB ? 1 : -1; // Real names first
          
          // Then sort by base name
          const baseA = getBaseUnitName(a);
          const baseB = getBaseUnitName(b);
          if (baseA !== baseB) return baseA.localeCompare(baseB);
          
          // Then sort by rank tier
          return getUnitRankTier(a) - getUnitRankTier(b);
        });
      }
      return rows;
    }

    function rowKey(row) {
      return `${state.view}:${row.id || row.path}`;
    }

    const typeOrder = ["Heroes", "Infantry", "Stormtroopers", "Heavy infantry", "Special", "Vehicles", "Heavy machinery", "Boss", "Bunker", "Defender"];
    const TYPE_ORDER_NORMALIZED = typeOrder.map(normalizeTypeName);
    // Looks up a type's sort priority via normalizeTypeName so a stray case or
    // singular/plural difference in the raw data can't silently drop a group
    // (e.g. Heroes) to the bottom of the list the way a strict indexOf would.
    function typeOrderIndex(type) {
      return TYPE_ORDER_NORMALIZED.indexOf(normalizeTypeName(type));
    }
    // Folds a type name onto its canonical display label (e.g. "hero" -> "Heroes")
    // so case/singular variants don't each get their own separate group header —
    // sorting them to the right place isn't enough if they never merge in the
    // first place. Falls back to the row's own raw label when it matches nothing
    // known, so an unrecognized type still gets its own (correctly spelled) group
    // rather than silently disappearing into "Unknown".
    function canonicalTypeLabel(type) {
      const idx = typeOrderIndex(type);
      return idx !== -1 ? typeOrder[idx] : ((type || "").trim() || "Unknown");
    }
    
    // Extract the base (family) unit name for grouping rank-tier siblings
    // together in the sidebar. Routed through classifyRank() — the same
    // parser the rank-tier math/simulator uses — instead of a separate
    // prefix-only check, because the real data mixes naming styles: some
    // tiers are space-prefixed ("Master Guardsman"), some are hyphenated
    // ("Ober-Guardsman"), and Veteran can be a SUFFIX instead of a prefix
    // ("Guardsman-veteran"). A prefix-only check misses the hyphen and
    // suffix forms, which put those units in their own single-unit group
    // and out of rank-tier order — classifyRank already handles all of it.
    function getBaseUnitName(unit) {
      const classified = classifyRank(unit.name);
      return classified ? classified.family : (unit.name || "");
    }
    
    // Check if a unit has a "real" name (not empty, not just whitespace, not just numbers)
    function hasRealName(unit) {
      const baseName = getBaseUnitName(unit).trim();
      if (!baseName) return false; // Empty name
      if (/^\d+$/.test(baseName)) return false; // Only digits
      return true;
    }
    
    // Check if a unit is "junk" - has no icon and/or no real name
    function isJunkUnit(unit) {
      const hasIcon = !!overrideManifest[String(unit.id)] || ((unit.icon && unit.icon.trim()) && !brokenIconIds.has(unit.id));
      const hasName = hasRealName(unit);
      return !hasIcon || !hasName;
    }
    // Get the rank tier from unit name, via the same classifyRank() parser
    // as above (see getBaseUnitName for why prefix-only matching isn't enough).
    // Rookie variants and anything unclassified sort as -1 (lowest/first),
    // matching the previous "no tier" behavior for plain Base-tier units.
    function getUnitRankTier(unit) {
      const classified = classifyRank(unit.name);
      if (!classified) return -1;
      const idx = RANK_ORDER.indexOf(classified.tier);
      return idx === -1 ? -1 : idx;
    }
    
    function renderListAndDetail() {
      const rows = filteredRows();
      let listHTML = "";
      
      // Only apply type-based grouping if not sorting by stat
      if (state.view === "units" && state.groupBy === "type" && !state.sortStat) {
        // Group rows by unit type, then by base name, then sort by rank tier
        const grouped = {};
        rows.forEach(row => {
          const type = canonicalTypeLabel(row.unit_type_name);
          if (!grouped[type]) grouped[type] = {};
          const baseName = getBaseUnitName(row);
          if (!grouped[type][baseName]) grouped[type][baseName] = [];
          grouped[type][baseName].push(row);
        });
        
        // Sort within each base name group by rank tier
        Object.keys(grouped).forEach(type => {
          Object.keys(grouped[type]).forEach(baseName => {
            grouped[type][baseName].sort((a, b) => getUnitRankTier(a) - getUnitRankTier(b));
          });
        });
        
        // Sort groups using predefined order
        const sortedTypes = Object.keys(grouped).sort((a, b) => {
          const indexA = typeOrderIndex(a);
          const indexB = typeOrderIndex(b);
          if (indexA === -1 && indexB === -1) return a.localeCompare(b);
          if (indexA === -1) return 1;
          if (indexB === -1) return -1;
          return indexA - indexB;
        });
        
        if (sortedTypes.length === 0) {
          listHTML = `<div class="empty">No matches</div>`;
        } else {
          listHTML = sortedTypes.map(type => {
            const groupedByBase = grouped[type];
            // Sort base names: real names first, then numeric/empty at bottom
            const sortedBaseNames = Object.keys(groupedByBase).sort((nameA, nameB) => {
              const hasRealA = !(nameA.trim() === "" || /^\d+$/.test(nameA.trim()));
              const hasRealB = !(nameB.trim() === "" || /^\d+$/.test(nameB.trim()));
              if (hasRealA !== hasRealB) return hasRealB ? 1 : -1; // Real names first
              return nameA.localeCompare(nameB); // Then alphabetically
            });
            const baseNameHtml = sortedBaseNames.map(baseName => {
              const baseRows = groupedByBase[baseName];
              return baseRows.map(rowButton).join("");
            }).join("");
            
            const groupState = groupExpandState[type];
            const isCollapsed = groupState !== undefined ? groupState === false : type !== "Infantry";
            return `
              <div class="group-section ${isCollapsed ? 'collapsed' : ''}" data-group-type="${esc(type)}">
                <div class="group-header" data-group-type="${esc(type)}">
                  <span class="group-toggle">${isCollapsed ? '▶' : '▼'}</span>
                  <span>${esc(type)}</span>
                </div>
                <div class="group-rows">
                  ${baseNameHtml}
                </div>
              </div>
            `;
          }).join("");
        }
      } else {
        listHTML = rows.map(rowButton).join("") || `<div class="empty">No matches</div>`;
      }
      
      $("list").innerHTML = listHTML;
      
      // Add click handlers for group headers
      $("list").querySelectorAll(".group-header").forEach(header => {
        header.addEventListener("click", (e) => {
          e.preventDefault();
          const groupType = header.dataset.groupType;
          const section = header.closest(".group-section");
          const isCurrentlyCollapsed = groupExpandState[groupType] === false;
          groupExpandState[groupType] = isCurrentlyCollapsed ? true : false;
          section.classList.toggle("collapsed");
          section.querySelector(".group-toggle").textContent = isCurrentlyCollapsed ? '▼' : '▶';
        });
      });
      
      const selected = rows.find(row => rowKey(row) === state.selected) || rows[0];
      state.selected = selected ? rowKey(selected) : null;
      $("list").querySelectorAll(".row").forEach(btn => btn.classList.toggle("active", btn.dataset.id === state.selected));
      $("list").querySelectorAll(".row").forEach(btn => btn.classList.toggle("junk-selected", state.junkSelection.has(btn.dataset.id)));
      if (state.combatMode) {
        renderCombatGrid();
      } else if (state.registryMode && state.view === "units") {
        renderRegistryBook(rows);
      } else {
        renderDetail(selected, rows.length);
      }
      if (state.junkReview && state.view === "units") renderJunkReview();
    }

    // Combat grid: replaces the center+right area (same footprint as the
    // registry book) with a fixed 26x16 grid of 50px squares (scrolls if the
    // viewport's narrower than that).
    //
    // - The Start button picks which team ("army") you're placing for; its
    //   background/label flips blue<->red on click.
    // - With no unit selected, clicking an empty square sets that team's spawn
    //   point (dashed outline marker). Clicking a unit row in the aside spawns
    //   it at that spawn point — or the nearest open square around it if it's
    //   occupied. Dragging a unit row onto a specific square spawns it there
    //   instead (again nearest-open-square if taken), bypassing the spawn point.
    // - Clicking a token selects it, showing green highlights on the empty
    //   cells it can move into this turn (up to its remaining Speed-derived
    //   move budget, any direction) and red highlights on enemy tokens it can
    //   attack (within its Range stat, measured in squares). Clicking a green
    //   cell moves it there and spends that much of its move budget; clicking a
    //   red target resolves an attack. Clicking empty/unreachable space deselects.
    // - End Turn recalculates every unit's move budget for the new turn from its
    //   Speed stat (see computeTurnMovement above).
    // dropCell (optional): {row, col} where the unit was dragged onto the grid.
    // Without it (e.g. clicking the unit row), spawning uses the current team's
    // spawn point instead — falling back to the first open cell if that team
    // hasn't set one yet. Either way, if the target square is already occupied,
    // the unit spawns in the nearest open square around it rather than failing.
    function spawnUnitOnGrid(unitId, dropCell) {
      const unit = findUnitById(unitId);
      if (!unit) return;
      let target;
      if (dropCell) {
        target = nearestFreeCell(dropCell.row, dropCell.col);
      } else {
        const spawnPoint = combatGridState.spawnPoints[combatGridState.spawnTeam];
        if (spawnPoint) {
          target = nearestFreeCell(spawnPoint.row, spawnPoint.col);
        } else {
          const total = COMBAT_GRID_COLS * COMBAT_GRID_ROWS;
          const occupied = new Set(combatGridState.instances.map(inst => inst.row * COMBAT_GRID_COLS + inst.col));
          let cell = -1;
          for (let i = 0; i < total; i++) {
            if (!occupied.has(i)) { cell = i; break; }
          }
          target = cell === -1 ? null : { row: Math.floor(cell / COMBAT_GRID_COLS), col: cell % COMBAT_GRID_COLS };
        }
      }
      if (!target) return; // grid full
      const count = getUnitCount(unit);
      const stats = computedStats(unit);
      const maxHp = Math.max(1, Math.round(Number(stats.HP || 0) * count) || 1);
      const inst = {
        id: combatGridState.nextInstanceId++,
        unitId: String(unit.id),
        team: combatGridState.spawnTeam,
        row: target.row,
        col: target.col,
        hp: maxHp,
        maxHp,
        count,
        moveCarry: 0,
        movesLeft: 0,
        attackTimeLeft: 0,
        targetId: null
      };
      startUnitTurn(inst); // grants its first turn's movement + attack budget immediately
      combatGridState.instances.push(inst);
      renderCombatGrid();
    }

    function combatInstanceAt(row, col) {
      return combatGridState.instances.find(inst => inst.row === row && inst.col === col);
    }

    function combatChebyshev(a, b) {
      return Math.max(Math.abs(a.row - b.row), Math.abs(a.col - b.col));
    }

    // Evasion-ignore shows up under either name depending on the unit/gear —
    // never both at once in practice — so summing covers both without
    // double-counting in the normal case.
    function combatEvasionIgnore(stats) {
      return Number(stats["Anti-Evasion"] || 0) + Number(stats["Ignore dodge"] || 0);
    }

    function resolveCombatAttack(attacker, defender) {
      const attackerUnit = findUnitById(attacker.unitId);
      const defenderUnit = findUnitById(defender.unitId);
      if (!attackerUnit || !defenderUnit) return null;
      const aStats = computedStats(attackerUnit);
      const dStats = computedStats(defenderUnit);
      const effectiveEvasion = Number(dStats.Evasion || 0) * (100 - combatEvasionIgnore(aStats)) / 100;
      const hitChance = Math.min(100, Math.max(0, Number(aStats.ACC || 0) * (100 - effectiveEvasion) / 100));
      const hit = Math.random() * 100 < hitChance;
      if (!hit) return { hit: false };
      const effectiveArmor = Number(dStats.Armor || 0) - Number(aStats.Penetration || 0);
      const perSoldierDmg = Math.max(1, Math.round(Number(aStats.DMG || 0) * (100 - effectiveArmor) / 100));
      const dealt = perSoldierDmg * (attacker.count || 1); // squad of N soldiers deals N x the damage
      defender.hp = Math.max(0, defender.hp - dealt);
      const killed = defender.hp === 0;
      if (killed) {
        combatGridState.instances = combatGridState.instances.filter(inst => inst.id !== defender.id);
      }
      return { hit: true, dealt, killed };
    }

    // Fires as many shots at `defender` as attacker.attackTimeLeft and its Reload
    // allow, charging the 0.1s retarget tax first if defender isn't already the
    // locked target. Stops early if defender dies (its instance is already
    // removed from the grid by resolveCombatAttack by that point) — any time left
    // over stays banked in attacker.attackTimeLeft for a follow-up click on a new
    // target this same turn.
    function performAttackBurst(attacker, defender) {
      const result = { retargeted: false, insufficientTime: false, shots: 0, hits: 0, dealt: 0, killed: false };
      if (attacker.targetId !== defender.id) {
        if (attacker.attackTimeLeft < COMBAT_RETARGET_COST) {
          result.insufficientTime = true;
          return result;
        }
        attacker.attackTimeLeft -= COMBAT_RETARGET_COST;
        attacker.targetId = defender.id;
        result.retargeted = true;
      }
      const attackerUnit = findUnitById(attacker.unitId);
      const reload = attackerUnit ? unitReloadSeconds(attackerUnit) : 1;
      while (attacker.attackTimeLeft >= reload && defender.hp > 0) {
        attacker.attackTimeLeft -= reload;
        const shot = resolveCombatAttack(attacker, defender);
        if (!shot) break;
        result.shots += 1;
        if (shot.hit) { result.hits += 1; result.dealt += shot.dealt; }
        if (shot.killed) { result.killed = true; break; }
      }
      return result;
    }

    // Nearest enemy of `attacker` within its Range, skipping any instance id in
    // `excludeIds` (already-killed targets from earlier in this same chain).
    // Ties broken by lowest current HP, so a chain naturally finishes off the
    // weakest nearby target next rather than picking arbitrarily.
    function findAutoTarget(attacker, excludeIds) {
      const attackerUnit = findUnitById(attacker.unitId);
      if (!attackerUnit) return null;
      const range = Number(computedStats(attackerUnit).Range || 0);
      let best = null, bestDist = Infinity, bestHp = Infinity;
      for (const inst of combatGridState.instances) {
        if (inst.team === attacker.team) continue;
        if (excludeIds && excludeIds.has(inst.id)) continue;
        const dist = combatChebyshev(attacker, inst);
        if (dist > range) continue;
        if (dist < bestDist || (dist === bestDist && inst.hp < bestHp)) {
          best = inst; bestDist = dist; bestHp = inst.hp;
        }
      }
      return best;
    }

    // Auto-attack chain: fires attacker's burst at `defender`, and if that kills
    // it with attack time still left (enough to cover the 0.1s retarget tax),
    // automatically picks the nearest remaining enemy in range and keeps going —
    // same-target shots never pay the tax again, only actually switching targets
    // does. Stops the moment attacks are exhausted for the turn (or no target
    // survives to switch to), matching the "spend it all, but retargeting always
    // costs 0.1s" rule. Returns one result entry per target actually engaged, in
    // order, for float-text rendering. Capped at 50 links as a runaway guard.
    function performAutoAttack(attacker, defender) {
      const events = [];
      let current = defender;
      const attackedIds = new Set();
      let guard = 0;
      while (current && guard++ < 50) {
        attackedIds.add(current.id);
        const cellIndex = current.row * COMBAT_GRID_COLS + current.col;
        const burst = performAttackBurst(attacker, current);
        if (burst.insufficientTime || burst.shots === 0) break;
        events.push({
          cellIndex,
          dealt: burst.dealt,
          hits: burst.hits,
          shots: burst.shots,
          killed: burst.killed
        });
        if (!burst.killed) break; // survived — time ran out on this target this turn
        if (attacker.attackTimeLeft < COMBAT_RETARGET_COST) break; // can't afford to switch
        current = findAutoTarget(attacker, attackedIds);
      }
      return events;
    }

    // True if `candidate` is among the nearest enemies of `attacker` within range —
    // i.e. there's no other enemy in range strictly closer. Units are forced to
    // engage the closest target first, so this gates both which cells light up as
    // attackable and which clicks are actually allowed to resolve as an attack.
    function isNearestAttackTarget(attacker, range, candidate) {
      const dist = combatChebyshev(attacker, candidate);
      if (dist > range) return false;
      for (const inst of combatGridState.instances) {
        if (inst.team === attacker.team || inst.id === candidate.id) continue;
        if (combatChebyshev(attacker, inst) <= range && combatChebyshev(attacker, inst) < dist) return false;
      }
      return true;
    }

    // Hover card for a placed unit: the same combat-card content (portrait, stats,
    // equipment, skin, first ability) used in the roster's detail view, but read-only
    // (wrapper has pointer-events:none, so nothing inside is clickable) and with HP
    // shown as the instance's live current/max rather than the static per-unit value.
    function combatHoverCardBodyHTML(inst) {
      const unit = findUnitById(inst.unitId);
      if (!unit) return "";
      const stats = computedStats(unit);
      const hidden = liveState[unit.id]?.hiddenStats || new Set();
      const statsHTML = cardStatList(stats).filter(stat => !hidden.has(stat)).map(stat => {
        const valueText = stat === "HP" ? `${inst.hp}/${inst.maxHp}` : esc(fmt(stats[stat]));
        return `<span class="combat-stat">${statIcon(stat)}${valueText}</span>`;
      }).join("");
      const realAbilities = (unit.abilities || []).filter(a => a.icon && a.description);
      const ability = realAbilities[0];
      const cardEquipHTML = equipmentIconGrid(unit, "card");
      const cardSkinHTML = skinSlotHTML(unit, "card");
      return `
        <div class="combat-head">
          <div class="combat-portrait-frame ${(unit.equipment_slots || []).length ? "portrait-hero" : "portrait-base"}">${combatPortraitViewport(unitImg(unit, "combat-portrait"))}</div>
          <div class="combat-name"><strong${nameColorStyle(unit.name)}>${esc(unit.name)}</strong><span class="combat-type-row"><span class="combat-type-label">${esc(unit.unit_type_name || rarityNames[unit.rarity] || "Unit")}</span>${squadCountBadge(unit)}</span></div>
        </div>
        <div class="combat-stats">${statsHTML}</div>
        <div class="combat-rule"></div>
        <p class="combat-description">${esc(unit.description || "")}</p>
        ${ability ? `<div class="combat-ability">${img(ability.icon, "")}<div><strong>${esc(ability.name)}</strong><p>${esc(ability.description || "")}</p></div></div>` : ""}
        ${cardEquipHTML ? `<div class="combat-rule"></div><div class="combat-equipment">${cardEquipHTML}</div>` : ""}
        ${cardSkinHTML}
      `;
    }

    let combatHoverPopoverEl = null;
    let combatHoverInstanceId = null;

    function showCombatBattlePopover(cellEl, inst) {
      hideCombatBattlePopover();
      combatHoverInstanceId = inst.id;
      const attackPct = Math.max(0, Math.min(100, ((inst.attackTimeLeft || 0) / COMBAT_TURN_SECONDS) * 100));
      const movePct = inst.moveBudget > 0 ? Math.max(0, Math.min(100, ((inst.movesLeft || 0) / inst.moveBudget) * 100)) : 0;
      const wrap = document.createElement("div");
      wrap.className = "combat-battle-popover-wrap";
      wrap.innerHTML = `
        <div class="combat-battle-bar-col">
          <div class="combat-battle-bar combat-battle-bar-attack"><div class="combat-battle-bar-fill" style="height:${attackPct}%"></div></div>
          <span>ATK</span>
        </div>
        <div class="combat-battle-popover">${combatHoverCardBodyHTML(inst)}</div>
        <div class="combat-battle-bar-col">
          <div class="combat-battle-bar combat-battle-bar-move"><div class="combat-battle-bar-fill" style="height:${movePct}%"></div></div>
          <span>MOV</span>
        </div>`;
      document.body.appendChild(wrap);
      combatHoverPopoverEl = wrap;
      const rect = cellEl.getBoundingClientRect();
      const wrapRect = wrap.getBoundingClientRect();
      let left = rect.right + 10;
      if (left + wrapRect.width > window.innerWidth) left = rect.left - wrapRect.width - 10;
      left = Math.max(8, Math.min(left, window.innerWidth - wrapRect.width - 8));
      let top = rect.top + rect.height / 2 - wrapRect.height / 2;
      top = Math.max(8, Math.min(top, window.innerHeight - wrapRect.height - 8));
      wrap.style.left = `${left}px`;
      wrap.style.top = `${top}px`;
    }

    function hideCombatBattlePopover() {
      if (combatHoverPopoverEl) { combatHoverPopoverEl.remove(); combatHoverPopoverEl = null; }
      combatHoverInstanceId = null;
    }

    function combatFloatText(cellIndex, text, cls) {
      const cellEl = document.querySelector(`.combat-cell[data-cell="${cellIndex}"]`);
      if (!cellEl) return;
      const el = document.createElement("span");
      el.className = `combat-float ${cls || ""}`;
      el.textContent = text;
      cellEl.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }

    function combatGridClick(event) {
      const cellEl = event.target.closest(".combat-cell");
      if (!cellEl) return;
      const index = Number(cellEl.dataset.cell);
      const row = Math.floor(index / COMBAT_GRID_COLS);
      const col = index % COMBAT_GRID_COLS;
      const clicked = combatInstanceAt(row, col);
      const selectedId = combatGridState.selectedInstanceId;
      const selected = selectedId != null ? combatGridState.instances.find(inst => inst.id === selectedId) : null;

      if (selected) {
        if (clicked && clicked.id === selected.id) {
          combatGridState.selectedInstanceId = null;
          renderCombatGrid();
          return;
        }
        if (clicked && clicked.team !== selected.team) {
          const selectedUnit = findUnitById(selected.unitId);
          const range = selectedUnit ? Number(computedStats(selectedUnit).Range || 0) : 0;
          if (combatChebyshev(selected, clicked) <= range && isNearestAttackTarget(selected, range, clicked)) {
            const events = performAutoAttack(selected, clicked);
            renderCombatGrid();
            events.forEach((ev, i) => {
              setTimeout(() => {
                if (ev.hits > 0) {
