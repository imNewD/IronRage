      document.querySelectorAll(".gear-dropdown.open").forEach(el => el.classList.remove("open"));
      if (idx === "new") {
        if (Number(value) >= 0) unitState.customAbilities.push(Number(value));
      } else if (Number(value) < 0) {
        unitState.customAbilities.splice(Number(idx), 1);
        if (unitState.customAbilityOverrides) delete unitState.customAbilityOverrides[idx];
      } else {
        unitState.customAbilities[Number(idx)] = Number(value);
        // Swapping to a different ability invalidates any name/text edit made
        // for whatever was previously in this slot.
        if (unitState.customAbilityOverrides) delete unitState.customAbilityOverrides[idx];
      }
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (unit) refreshCustomAbilities(unit);
    }

    // Lets you rewrite the name/description shown for an ability on a unit —
    // either one of its own real abilities or a custom one you've pinned.
    // Purely a display override, session-only, never touches the underlying
    // ability data (same convention as the stat-value and gear-value edit
    // popups). kind is "real" (unit's own ability, from unit.abilities) or
    // "custom" (a pinned extra ability) — defaults to "custom" for old callers.
    function openAbilityEditPopup(unitId, idx, kind) {
      kind = kind || "custom";
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (!unit) return;
      let ability, override, overrideStore;
      if (kind === "real") {
        const realAbilities = (unit.abilities || []).filter(a => a.icon && a.description);
        ability = realAbilities[idx];
        override = liveState[unitId]?.realAbilityOverrides?.[idx];
        overrideStore = "realAbilityOverrides";
      } else {
        const val = liveState[unitId]?.customAbilities?.[idx];
        ability = val !== undefined && val >= 0 ? ALL_ABILITIES[val] : null;
        override = liveState[unitId]?.customAbilityOverrides?.[idx];
        overrideStore = "customAbilityOverrides";
      }
      if (!ability) return;
      const name = override?.name ?? ability.name;
      const description = override?.description ?? (ability.description || "");
      document.querySelectorAll(".value-edit-modal-backdrop").forEach(el => el.remove());
      const backdrop = document.createElement("div");
      backdrop.className = "value-edit-modal-backdrop";
      backdrop.innerHTML = `
        <div class="value-edit-modal">
          <button type="button" class="compare-modal-close" id="ability-edit-close">&times;</button>
          <div class="compare-modal-title">Edit ability</div>
          <div class="value-edit-hint">Changes here only apply live in this session — they aren't saved anywhere.</div>
          <label class="value-edit-field-label">Name</label>
          <input type="text" class="value-edit-text-input" value="${esc(name)}" oninput="setAbilityOverride('${esc(unitId)}','${idx}','name',this.value,'${kind}')">
          <label class="value-edit-field-label">Description</label>
          <textarea class="value-edit-textarea" oninput="setAbilityOverride('${esc(unitId)}','${idx}','description',this.value,'${kind}')">${esc(description)}</textarea>
        </div>`;
      document.body.appendChild(backdrop);
      const close = () => backdrop.remove();
      backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
      $("ability-edit-close").addEventListener("click", close);
    }

    function setAbilityOverride(unitId, idx, field, rawValue, kind) {
      const ls = liveState[unitId];
      if (!ls) return;
      const key = kind === "real" ? "realAbilityOverrides" : "customAbilityOverrides";
      ls[key] = ls[key] || {};
      ls[key][idx] = ls[key][idx] || {};
      ls[key][idx][field] = rawValue;
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (unit) refreshCustomAbilities(unit);
    }

    // Lets you rewrite the description shown on a unit's card — same
    // session-only display-override convention as the stat/ability edit
    // popups above; never touches unit.description itself.
    function openDescriptionEditPopup(unitId) {
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (!unit) return;
      const current = liveState[unitId]?.descriptionOverride ?? (unit.description || "");
      document.querySelectorAll(".value-edit-modal-backdrop").forEach(el => el.remove());
      const backdrop = document.createElement("div");
      backdrop.className = "value-edit-modal-backdrop";
      backdrop.innerHTML = `
        <div class="value-edit-modal">
          <button type="button" class="compare-modal-close" id="description-edit-close">&times;</button>
          <div class="compare-modal-title">Edit description</div>
          <div class="value-edit-hint">Changes here only apply live in this session — they aren't saved anywhere.</div>
          <textarea class="value-edit-textarea" oninput="setDescriptionOverride('${esc(unitId)}',this.value)">${esc(current)}</textarea>
        </div>`;
      document.body.appendChild(backdrop);
      const close = () => backdrop.remove();
      backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
      $("description-edit-close").addEventListener("click", close);
    }

    function setDescriptionOverride(unitId, rawValue) {
      const ls = liveState[unitId];
      if (!ls) return;
      ls.descriptionOverride = rawValue;
      const el = $(`description-${unitId}`);
      if (el) el.textContent = rawValue || "No description captured.";
    }

    // Lets you rewrite the name shown on a unit's card — same session-only
    // display-override convention as the description/ability edit popups
    // above; never touches unit.name itself. Routed through updateLiveUnit()
    // (rather than a direct textContent poke like setDescriptionOverride)
    // because the name element also layers in roster/skin/rank-tier text and
    // color, and that combined logic already lives in updateLiveUnit().
    function openNameEditPopup(unitId) {
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (!unit) return;
      const current = liveState[unitId]?.nameOverride ?? unit.name;
      document.querySelectorAll(".value-edit-modal-backdrop").forEach(el => el.remove());
      const backdrop = document.createElement("div");
      backdrop.className = "value-edit-modal-backdrop";
      backdrop.innerHTML = `
        <div class="value-edit-modal">
          <button type="button" class="compare-modal-close" id="name-edit-close">&times;</button>
          <div class="compare-modal-title">Edit name</div>
          <div class="value-edit-hint">Changes here only apply live in this session — they aren't saved anywhere.</div>
          <input type="text" class="value-edit-text-input" value="${esc(current)}" oninput="setNameOverride('${esc(unitId)}',this.value)">
        </div>`;
      document.body.appendChild(backdrop);
      const close = () => backdrop.remove();
      backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
      $("name-edit-close").addEventListener("click", close);
    }

    function setNameOverride(unitId, rawValue) {
      const ls = liveState[unitId];
      if (!ls) return;
      ls.nameOverride = rawValue;
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (unit) updateLiveUnit(unit);
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".equip-slot, .custom-ability-row, .custom-ability-add")) {
        document.querySelectorAll(".gear-dropdown.open").forEach(el => el.classList.remove("open"));
      }
    });

    // Dropdowns are position:fixed (so they can render above scrollable panels
    // instead of being clipped by them) and are positioned once on open, so a
    // scroll would leave them stranded relative to their anchor — just close them.
    document.addEventListener("scroll", (e) => {
      // Scrolling *inside* an open dropdown (or its search box) must not close it —
      // only close on scrolls that happen elsewhere (e.g. the page or a side panel).
      if (e.target instanceof Element && e.target.closest(".gear-dropdown")) return;
      document.querySelectorAll(".gear-dropdown.open").forEach(el => el.classList.remove("open"));
    }, true);

    function trainingControls(unit) {
      const training = unit.training || {};
      const saved = liveState[unit.id]?.training || {};
      const keys = Object.keys(training).filter(stat => stat && (training[stat] || []).length > 0);
      if (!keys.length) return `<p>No training values captured.</p>`;
      return keys.map(stat => {
        const max = (training[stat] || []).length;
        const value = saved[stat] ?? 0;
        return `<label class="control-row"><span>${esc(stat)}</span><input data-train="${esc(stat)}" type="range" min="0" max="${max}" value="${value}"><span id="tier-${esc(unit.id)}-${esc(stat)}">${value}/${max}</span></label>`;
      }).join("");
    }

    // Base -> Ober -> Master -> Veteran -> Legionnaire is a separate upgrade line some
    // units have, distinct from the numeric training tiers above. There's no data field
    // for it, so this is a manual, per-unit toggle: checking a tier appends its name to
    // the displayed name and recolors it. Mutually exclusive (checking one clears the
    // others) since a unit can only hold one rank at a time — unchecking returns to base.
    // `check` is the checkmark color for the checked-box state below — most tier
    // colors are light enough that the near-black default (#141412, matched in the
    // CSS ::after rule) reads fine, but Veteran's dark purple needs a light
    // checkmark instead or the ✓ is nearly invisible against it (~1.8:1 contrast
    // with black vs ~8.8:1 with this).
    const RANK_TIERS = [
      { key: "Ober", color: "rgb(144,222,137)" },
      { key: "Master", color: "rgb(80,127,208)" },
      { key: "Veteran", color: "rgb(92,41,119)", check: "#f0ece2" },
      { key: "Legionnaire", color: "rgb(219,204,127)" }
    ];

    function rankTierControlsHTML(unit) {
      // Infantry, Stormtroopers, Heavy infantry, and Special all have a fitted
      // estimate model now (see RANK_MODELS / rankAdjustedBaseStats). Hidden for
      // every other category until that math gets worked out too. Stormtroopers,
      // Heavy infantry, and Special all reuse the same RANK_TIERS colors as
      // Infantry rather than a separate palette per category.
      if (!(unit.unit_type_name === "Infantry" || unit.unit_type_name === "Stormtroopers" || unit.unit_type_name === "Heavy infantry" || unit.unit_type_name === "Special")) return "";
      const current = liveState[unit.id]?.rankTier || null;
      return `<div class="rank-tier-row" id="rank-tier-${esc(unit.id)}">${RANK_TIERS.map(t => `
        <label class="rank-tier-check" style="--tier-color:${t.color};--tier-check:${t.check || "#141412"}">
          <input type="checkbox" data-rank-tier="${esc(t.key)}" ${current === t.key ? "checked" : ""} onchange="selectRankTier('${esc(unit.id)}','${esc(t.key)}', this.checked)">
          <span>${esc(t.key)}</span>
        </label>`).join("")}</div><div class="small" id="rank-tier-note-${esc(unit.id)}">${esc(rankTierNote(unit))}</div>`;
    }

    function selectRankTier(unitId, tier, checked) {
      liveState[unitId] = liveState[unitId] || { training: {}, equipment: {}, loadout: {}, rankTier: null };
      liveState[unitId].rankTier = checked ? tier : null;
      const row = $(`rank-tier-${unitId}`);
      if (row) row.querySelectorAll("input[type=checkbox]").forEach(cb => { cb.checked = cb.dataset.rankTier === liveState[unitId].rankTier; });
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (unit) updateLiveUnit(unit);
    }

    function attachLiveControls(unit) {
      $("side-panel").querySelectorAll("[data-train]").forEach(input => {
        input.addEventListener("input", () => {
          liveState[unit.id].training[input.dataset.train] = Number(input.value);
          updateLiveUnit(unit);
        });
      });
    }

    function computedStats(unit) {
      const stateForUnit = liveState[unit.id] || {training: {}, equipment: {}, loadout: {}};
      // When a specific roster soldier is selected on a compound squad, show that soldier's
      // own captured stat block as-is rather than the squad's blended/computed stats.
      const compound = COMPOUND_SQUADS[String(unit.id)];
      const rosterId = stateForUnit.rosterView;
      if (compound && rosterId) {
        const soldier = compound.soldiers.find(s => s.soldier_id === rosterId);
        if (soldier) return {...soldier.stats};
      }
      const computed = {...(rankAdjustedBaseStats(unit, stateForUnit.rankTier).stats || {})};
      Object.entries(unit.training || {}).forEach(([stat, tiers]) => {
        const count = Number(stateForUnit.training[stat] || 0);
        const add = (tiers || []).slice(0, count).reduce((sum, value) => sum + Number(value || 0), 0);
        computed[stat] = Number(computed[stat] || 0) + add;
      });
      // Routed through equipSlotList() rather than unit.equipment_slots directly, so the
      // stored "picked" index always resolves against the same merged own+non-specific+
      // other options array the dropdown actually shows — including hero and troop slots.
      equipSlotList(unit).forEach(entry => {
        const bucket = entry.attr === "data-equip" ? stateForUnit.equipment : stateForUnit.loadout;
        const choice = Number(bucket[entry.attrVal] ?? -1);
        const item = choice >= 0 ? entry.options[choice] : null;
        // Manual value overrides from the double-click "Edit values" popup —
        // session-only, never persisted. Falls back to the captured value.
        const overrides = stateForUnit.overrides?.[entry.key];
        Object.entries(item?.bonus || {}).forEach(([rawKey, value]) => {
          const stat = statIdToName[rawKey] || rawKey;
          const ov = overrides?.item?.[rawKey];
          computed[stat] = Number(computed[stat] || 0) + Number((ov !== undefined ? ov : value) || 0);
        });
        (stateForUnit.mods?.[entry.key] || []).map(modById).filter(Boolean).forEach(mod => {
          Object.entries(mod.statBonus || {}).forEach(([rawKey, value]) => {
            const stat = statIdToName[rawKey] || rawKey;
            const ov = overrides?.mods?.[mod.id]?.[rawKey];
            computed[stat] = Number(computed[stat] || 0) + Number((ov !== undefined ? ov : value) || 0);
          });
        });
      });
      const skinIdx = stateForUnit.skin;
      const skinItem = skinIdx !== undefined && Number(skinIdx) >= 0 ? skinOptionsForUnit(unit)[Number(skinIdx)] : null;
      Object.entries(skinItem?.bonus || {}).forEach(([rawKey, value]) => {
        const stat = statIdToName[rawKey] || rawKey;
        computed[stat] = Number(computed[stat] || 0) + Number(value || 0);
      });
      // Ticked research tiers (session-only) — see researchStatBonuses().
      Object.entries(researchStatBonuses(unit)).forEach(([stat, value]) => {
        computed[stat] = Number(computed[stat] || 0) + value;
      });
      // Manual per-stat overrides from clicking a value directly on the combat
      // card — session-only, never persisted, applied last so it always wins.
      if (stateForUnit.statOverrides) {
        Object.entries(stateForUnit.statOverrides).forEach(([stat, value]) => {
          computed[stat] = value;
        });
      }
      return computed;
    }

    function gearSummary(unit) {
      const list = equipSlotList(unit).filter(entry => entry.picked !== undefined && Number(entry.picked) >= 0);
      if (!list.length) return `<p class="small">No gear equipped.</p>`;
      return list.map(entry => {
        const item = entry.options[Number(entry.picked)];
        if (!item) return "";
        const bonusText = Object.entries(item.bonus || {}).map(([rawKey, value]) => `${statIcon(statIdToName[rawKey] || rawKey)}${esc(fmt(value))}`).join(" ");
        return `<div class="gear-summary-row">${img(item.icon, "")}<div><strong>${esc(item.name)}</strong><div class="small">${bonusText || "No bonus captured"}</div></div></div>`;
      }).join("");
    }

    // The captured game data has no field linking a skin to a specific unit id
    // (unlike equipment, which carries a "units" list) — so every skin in the
    // catalog is offered to every unit here. If a real unit-to-skin mapping ever
    // turns up in the source data, filter this down to that unit's own skins.
    // No field in the captured data ties a skin to a specific unit id or type — so
    // this is a best-effort heuristic: a skin's codename ("view") and display name
    // are scanned for a handful of class words that also show up in unit_type_name
    // (Infantry, Stormtroopers, Heavy machinery/infantry, Heroes, Special, Defender,
    // Vehicles). Most skin codenames are arbitrary and match nothing — those are left
    // visible on every unit rather than guessed away. Tighten/replace this if a real
    // unit<->skin mapping ever turns up in the source data.
    const SKIN_TYPE_HINTS = [
      { match: /infantry/i, type: "infantry" },
      { match: /storm/i, type: "stormtroop" },
      { match: /heavy/i, type: "heavy" },
      { match: /hero/i, type: "heroe" },
      { match: /special|_spec/i, type: "special" },
      { match: /defend/i, type: "defend" },
      { match: /vehic|tank/i, type: "vehicle" }
    ];

    function skinTypeHints(skin) {
      const blob = `${skin.view || ""} ${skin.name || ""}`.toLowerCase();
      return SKIN_TYPE_HINTS.filter(h => h.match.test(blob)).map(h => h.type);
    }

    // Upgrade tiers (MK II, MK III, …) all point back to their root via base_skin,
    // and each tier's skin_price.sID names the id of the *next* tier up — that chain
    // is the actual upgrade order, more reliable than parsing "MK" numerals out of
    // the name. Any family member the chain doesn't reach (data gaps) is appended
    // at the end rather than dropped.
    function skinTierOrder(members) {
      const byId = new Map(members.map(s => [String(s.id), s]));
      const root = members.find(s => !(s.base_skin && s.base_skin.length)) || members[0];
      const ordered = [root];
      const seen = new Set([String(root.id)]);
      let current = root;
      while (current?.skin_price?.sID && byId.has(String(current.skin_price.sID)) && !seen.has(String(current.skin_price.sID))) {
        current = byId.get(String(current.skin_price.sID));
        ordered.push(current);
        seen.add(String(current.id));
      }
      members.forEach(s => { if (!seen.has(String(s.id))) { ordered.push(s); seen.add(String(s.id)); } });
      return ordered;
    }

    function skinFamilies(skins) {
      const families = new Map();
      skins.forEach(skin => {
        const root = (skin.base_skin && skin.base_skin.length) ? String(skin.base_skin[0]) : String(skin.id);
        if (!families.has(root)) families.set(root, []);
        families.get(root).push(skin);
      });
      return families;
    }

    function skinOptionsForUnit(unit) {
      const unitType = (unit.unit_type_name || "").toLowerCase();
      const result = [];
      skinFamilies(views.skins).forEach(members => {
        const hints = skinTypeHints(members[0]);
        const visible = !hints.length || hints.some(h => unitType.includes(h));
        if (visible) result.push(...skinTierOrder(members));
      });
      return result;
    }

    function skinSlotHTML(unit, loc) {
      const options = skinOptionsForUnit(unit);
      if (!options.length) return "";
      const picked = liveState[unit.id]?.skin;
      const item = picked !== undefined && Number(picked) >= 0 ? options[Number(picked)] : null;
      // Same read-only-summary rule as equipmentIconGrid: hide the skin slot on the card
      // when nothing is applied; it reappears there once a skin is picked in the live editor.
      if (loc === "card" && !item) return "";
      const noneActive = picked === undefined || Number(picked) < 0;
      const domIdx = `skin-${loc}`;

      const itemRow = (opt, j) => {
        const bonusText = Object.entries(opt.bonus || {}).map(([rawKey, value]) => `${statIcon(statIdToName[rawKey] || rawKey)}${esc(fmt(value))}`).join(" ");
        return `<div class="gear-dropdown-item ${String(picked) === String(j) ? "active" : ""}" data-name="${esc((opt.name || "").toLowerCase())}" onclick="selectUnitSkin('${esc(unit.id)}',${j})">${img(opt.icon, "")}<div class="gear-dropdown-text"><strong>${esc(opt.name)}</strong><div class="small">${bonusText || "No bonus captured"}</div></div></div>`;
      };

      // Re-group the flat, already tier-ordered list back into families purely for
      // display, so a skin with upgrades collapses under one expandable row instead
      // of listing every MK level flat in the dropdown; single-tier skins stay flat.
      const indicesByRoot = new Map();
      options.forEach((opt, j) => {
        const root = (opt.base_skin && opt.base_skin.length) ? String(opt.base_skin[0]) : String(opt.id);
        if (!indicesByRoot.has(root)) indicesByRoot.set(root, []);
        indicesByRoot.get(root).push(j);
      });

      let g = 0;
      const rows = [...indicesByRoot.values()].map(indices => {
        if (indices.length === 1) return itemRow(options[indices[0]], indices[0]);
        const root = options[indices[0]];
        const groupId = `skin-group-${esc(unit.id)}-${esc(domIdx)}-${g++}`;
        const hasActiveTier = indices.some(j => String(picked) === String(j));
        const collapsed = !hasActiveTier;
        return `<button type="button" class="gear-dropdown-group-toggle" data-group-target="${groupId}" data-label="${esc(root.name)}" data-count="${indices.length}" data-collapsed="${collapsed}" onclick="toggleGearGroup(this)">${esc(root.name)} (${indices.length} tiers) ${collapsed ? "&#9656;" : "&#9662;"}</button>
          <div class="gear-dropdown-group" id="${groupId}" ${collapsed ? "hidden" : ""}>${indices.map(j => itemRow(options[j], j)).join("")}</div>`;
      }).join("");

      return `<div class="equip-section-label">Skin</div><div class="equip-slots"><div class="equip-slot" title="${item ? esc(item.name) : "No skin applied"}">
        <button type="button" class="equip-slot-btn" onclick="toggleGearDropdown('${esc(unit.id)}', '${domIdx}')">
          <img id="skin-icon-${esc(unit.id)}-${esc(loc)}" src="${item ? esc(item.icon) : ""}" style="${item ? "" : "display:none;"}">
          ${item ? "" : `<span class="small">Skin</span>`}
        </button>
        <div class="gear-dropdown" id="gear-dropdown-${esc(unit.id)}-${domIdx}">
          <input type="text" class="gear-search" id="gear-search-${esc(unit.id)}-${domIdx}" placeholder="Search skins…" oninput="filterGearDropdown('${esc(unit.id)}', '${domIdx}')">
          <div class="gear-dropdown-item ${noneActive ? "active" : ""}" onclick="selectUnitSkin('${esc(unit.id)}',-1)">None</div>
          ${rows}
        </div>
      </div></div>`;
    }

    function skinSummary(unit) {
      const options = skinOptionsForUnit(unit);
      const picked = liveState[unit.id]?.skin;
      const item = picked !== undefined && Number(picked) >= 0 ? options[Number(picked)] : null;
      if (!item) return `<p class="small">No skin applied.</p>`;
      const bonusText = Object.entries(item.bonus || {}).map(([rawKey, value]) => `${statIcon(statIdToName[rawKey] || rawKey)}${esc(fmt(value))}`).join(" ");
      return `<div class="gear-summary-row">${img(item.icon, "")}<div><strong>${esc(item.name)}</strong><div class="small">${bonusText || "No bonus captured"}</div></div></div>`;
    }

    function selectUnitSkin(unitId, value) {
      liveState[unitId].skin = Number(value);
      saveLiveBuilds();
      document.querySelectorAll(".gear-dropdown.open").forEach(el => el.classList.remove("open"));
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (unit) updateLiveUnit(unit);
    }

    // Card stat values are click-to-edit: opens a small popup with a single
    // input plus Confirm/Exit. Confirm stores a per-stat override (session-only,
    // never persisted — same rule as the equip-icon value editor); Exit/backdrop
    // click discards without changing anything.
    function openStatValuePopup(unitId, stat) {
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (!unit) return;
      document.querySelectorAll(".stat-value-modal-backdrop").forEach(el => el.remove());
      const current = computedStats(unit)[stat];
      const backdrop = document.createElement("div");
      backdrop.className = "stat-value-modal-backdrop";
      backdrop.innerHTML = `
        <div class="stat-value-modal">
          <div class="compare-modal-title">${statIcon(stat)}${esc(niceKey(stat))}</div>
          <input type="number" step="any" class="stat-value-input" id="stat-value-input" value="${esc(current)}">
          <div class="stat-value-modal-actions">
            <button type="button" class="btn-under-card" id="stat-value-cancel">Exit</button>
            <button type="button" class="btn-under-card btn-compare-target" id="stat-value-confirm">Confirm</button>
          </div>
          <div class="value-edit-hint">Live for this session only — not saved.</div>
        </div>`;
      document.body.appendChild(backdrop);
      const close = () => backdrop.remove();
      const confirm = () => {
        const num = Number($("stat-value-input").value);
        if (!Number.isNaN(num)) {
          liveState[unitId].statOverrides = liveState[unitId].statOverrides || {};
          liveState[unitId].statOverrides[stat] = num;
          updateLiveUnit(unit);
        }
        close();
      };
      backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
      $("stat-value-cancel").addEventListener("click", close);
      $("stat-value-confirm").addEventListener("click", confirm);
      const input = $("stat-value-input");
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") confirm();
        else if (e.key === "Escape") close();
      });
      input.focus();
      input.select();
    }

    function updateLiveUnit(unit) {
      const stats = computedStats(unit);
      const stateForUnit = liveState[unit.id] || {training: {}, equipment: {}, loadout: {}};
      const highestLevel = Math.max(0, ...Object.values(stateForUnit.training || {}).map(Number));
      const levelEl = $(`live-level-${unit.id}`);
      if (levelEl) levelEl.textContent = `Lvl.${highestLevel + 1}`;
      const card = $(`live-card-stats-${unit.id}`);
      if (card) {
        const hidden = liveState[unit.id]?.hiddenStats || new Set();
        const visibleStats = cardStatList(stats).filter(stat => !hidden.has(stat));
        card.innerHTML = visibleStats.map(stat => `<span class="combat-stat editable-stat" title="Click to edit ${esc(niceKey(stat))}" onclick="openStatValuePopup('${esc(unit.id)}','${esc(stat)}')">${statIcon(stat)}${esc(fmt(stats[stat]))}</span>`).join("");
      }
      const toggleRow = $(`stat-toggles-${unit.id}`);
      if (toggleRow) toggleRow.outerHTML = statToggleRowHTML(unit);
      const squadBadge = $(`squad-badge-${unit.id}`);
      if (squadBadge) squadBadge.style.display = (liveState[unit.id]?.hiddenStats || new Set()).has("squad") ? "none" : "";
      Object.entries(unit.training || {}).forEach(([stat, tiers]) => {
        const tier = $(`tier-${unit.id}-${stat}`);
        if (tier) tier.textContent = `${Number(stateForUnit.training[stat] || 0)}/${(tiers || []).length}`;
      });
      const cardEquip = $(`combat-equipment-${unit.id}`);
      const cardEquipHTML = equipmentIconGrid(unit, "card");
      if (cardEquip) cardEquip.innerHTML = cardEquipHTML;
      const equipRule = $(`combat-rule-equip-${unit.id}`);
      if (equipRule) equipRule.style.display = cardEquipHTML ? "" : "none";
      const gearEl = $(`gear-summary-${unit.id}`);
      if (gearEl) gearEl.innerHTML = equipmentIconGrid(unit, "live");
      const skinIdx = liveState[unit.id]?.skin;
      const skinItem = skinIdx !== undefined && Number(skinIdx) >= 0 ? skinOptionsForUnit(unit)[Number(skinIdx)] : null;
      const cardSkinBlock = $(`skin-block-${unit.id}-card`);
      const cardSkinHTML = skinSlotHTML(unit, "card");
      if (cardSkinBlock) cardSkinBlock.innerHTML = cardSkinHTML;
      const skinRule = $(`combat-rule-skin-${unit.id}`);
      if (skinRule) skinRule.style.display = cardSkinHTML ? "" : "none";
      const liveSkinBlock = $(`skin-block-${unit.id}-live`);
      if (liveSkinBlock) liveSkinBlock.innerHTML = skinSlotHTML(unit, "live");
      const portraitEl = $(`combat-portrait-${unit.id}`);
      const compound = COMPOUND_SQUADS[String(unit.id)];
      const rosterId = liveState[unit.id]?.rosterView;
      const rosterSoldier = compound && rosterId ? compound.soldiers.find(s => s.soldier_id === rosterId) : null;
      if (portraitEl) {
        portraitEl.style.visibility = "";
        if (rosterSoldier) {
          portraitEl.onerror = () => { portraitEl.style.visibility = "hidden"; };
          portraitEl.src = `https://dl-static-local.islandsville.com/resources/icons/Soldier/${rosterSoldier.preview}.jpg`;
        } else if (skinItem && skinItem.icon) {
          portraitEl.onerror = () => { portraitEl.style.visibility = "hidden"; };
          portraitEl.src = skinItem.icon;
        } else {
          // No skin/roster override in play — use the base unit portrait,
          // preferring an images/overrides/ file if the manifest has one for this ID.
          const orig = unit.icon || "";
          const overrideFile = overrideManifest[String(unit.id)];
          if (overrideFile) {
            portraitEl.onerror = () => {
              if (orig) {
                portraitEl.onerror = () => { portraitEl.style.visibility = "hidden"; };
                portraitEl.src = orig;
              } else {
                portraitEl.style.visibility = "hidden";
              }
            };
            portraitEl.src = `images/overrides/${overrideFile}`;
          } else {
            portraitEl.onerror = () => { portraitEl.style.visibility = "hidden"; };
            portraitEl.src = orig;
          }
        }
      }
      const nameEl = $(`combat-name-${unit.id}`);
      if (nameEl) {
        const baseName = liveState[unit.id]?.nameOverride ?? (rosterSoldier ? prettifySlug(rosterSoldier.preview) : (skinItem ? skinItem.name : unit.name));
        const tier = liveState[unit.id]?.rankTier;
        const tierInfo = RANK_TIERS.find(t => t.key === tier);
        nameEl.textContent = tierInfo && !rosterSoldier ? `${baseName} ${tierInfo.key}` : baseName;
        // Manual tier pick wins if set; otherwise fall back to the color implied by
        // the unit's own name (e.g. "Ober-Guardsman" already reads as Ober, even
        // with no checkbox touched) via rankTierColorForName — same colors either way.
        nameEl.style.color = tierInfo && !rosterSoldier ? tierInfo.color : (rankTierColorForName(baseName) || "");
      }
      const rosterRow = $(`roster-icon-row-${unit.id}`);
      if (rosterRow) rosterRow.innerHTML = rosterIconRowHTML(unit);
      const rankNote = $(`rank-tier-note-${unit.id}`);
      if (rankNote) rankNote.textContent = rankTierNote(unit);
    }

    function renderSupport(support, count) {
      $("detail").innerHTML = `
        <div class="hero">${img(support.icon, "portrait")}<div><h2>${esc(support.name || support.id)}</h2><div class="badges"><span class="badge">ID ${esc(support.id)}</span><span class="badge">Elite ${esc(support.elite)}</span><span class="badge">Score ${esc(support.scores)}</span><span class="badge">${count} shown</span></div><p>${esc(support.description || "No description captured.")}</p></div></div>
        <h3>Hidden Stats</h3>
        <div class="grid">${Object.entries(support.hidden_stats || {}).map(([k, v]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("") || `<p>No hidden stats captured.</p>`}</div>
        <h3>Defence / Requirements</h3>
        ${(support.defence || []).map(row => `<div class="support-card"><div class="kv">${pretty(row.bonus)}</div><div class="kv">${pretty(row.req)}</div></div>`).join("") || `<p>No defence data captured.</p>`}`;
    }

    function renderEquipment(item, count) {
      $("detail").innerHTML = `
        <div class="hero">${img(item.icon, "portrait")}<div><h2>${esc(item.name)}</h2><div class="badges"><span class="badge">ID ${esc(item.id)}</span><span class="badge">Slots ${(item.slots || []).map(esc).join(", ")}</span><span class="badge">${count} shown</span></div><h3>Bonuses</h3><div class="kv">${pretty(item.bonus)}</div><h3>Price</h3><div class="kv">${pretty(item.price)}</div></div></div>
        <h3>Used By</h3>
        <div class="grid">${(item.units || []).map(unit => `<button class="card-button panel" onclick="jumpToUnit('${esc(unit.id)}')"><strong>${esc(unit.name)}</strong><div class="small">ID ${esc(unit.id)}</div></button>`).join("")}</div>`;
    }

    function renderSkin(skin, count) {
      $("detail").innerHTML = `
        <div class="hero">${img(skin.icon, "portrait")}<div>
          <h2>${esc(skin.name)}</h2>
          <div class="badges"><span class="badge">ID ${esc(skin.id)}</span><span class="badge">${esc(rarityNames[skin.rarity] || `Rarity ${skin.rarity ?? "?"}`)}</span><span class="badge">${count} shown</span></div>
          <p>${esc(skin.description || "No description captured.")}</p>
          <h3>Bonuses</h3>
          <div class="kv">${pretty(skin.bonus)}</div>
          <h3>Price</h3>
          <div class="kv">${pretty(skin.price)}</div>
          ${skin.base_skin?.length ? `<h3>Base Skin</h3><div class="kv">${skin.base_skin.map(id => `<code>${esc(id)}</code>`).join("")}</div>` : ""}
        </div></div>
        <h3>Skin Gallery</h3>
        <div class="skin-grid">${filteredRows().map(row => `<button class="asset" onclick="selectSkin('${esc(row.id)}')">${img(row.icon || row.path)}<div>${esc(row.name)}</div></button>`).join("")}</div>`;
    }

    function renderAsset(asset, count) {
      const rows = filteredRows();
      $("detail").innerHTML = `
        <div class="hero">${img(asset.path, "portrait")}<div><h2>${esc(asset.name)}</h2><div class="badges"><span class="badge">${esc(asset.category)}</span><span class="badge">${esc(asset.ext)}</span><span class="badge">${count} shown</span></div><p>${esc(asset.path)}</p></div></div>
        <h3>Gallery</h3>
        <div class="asset-grid">${rows.map(row => `<button class="asset" onclick="selectAsset('${esc(row.path)}')">${img(row.path)}<div>${esc(row.name)}</div></button>`).join("")}</div>`;
    }

    function renderAudit(row, count) {
      const issueList = (row.issues || []).map(issue => `<li>${esc(issue)}</li>`).join("");
      const action = row.recommendation || "Review against the original game data before changing the catalog.";
      $("detail").innerHTML = `
        <div class="hero"><div class="portrait"></div><div><h2>${esc(row.name || "Unnamed record")}</h2><div class="badges"><span class="badge">ID ${esc(row.id)}</span><span class="badge">${esc(row.severity)} priority</span><span class="badge">${count} audit records</span></div><p>${esc(row.preview || "No preview captured.")}</p></div></div>
        <h3>Findings</h3><ul>${issueList || "<li>No findings.</li>"}</ul>
        <h3>Recommended action</h3><p>${esc(action)}</p>
        <h3>Raw reference</h3><div class="kv"><code>${esc(row.reference || `units_full.json:${row.id}`)}</code></div>`;
    }

    function effectSummary(effects) {
      if (!effects || !effects.length) return "";
      return `<details><summary>${effects.length} effect records</summary><pre>${esc(JSON.stringify(effects, null, 2))}</pre></details>`;
    }

    function trainingTable(training) {
      const keys = Object.keys(training || {});
      if (!keys.length) return `<p>No training data captured.</p>`;
      const max = Math.max(...keys.map(k => (training[k] || []).length));
      let rows = "";
      for (let i = 0; i < max; i++) {
        rows += `<tr><td>${i + 1}</td>${keys.map(k => `<td>${esc((training[k] || [])[i] ?? "")}</td>`).join("")}</tr>`;
      }
      return `<div class="table-scroll"><table><thead><tr><th>Level</th>${keys.map(k => `<th>${esc(k)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function rankTables(rank) {
      const entries = Object.entries(rank || {});
      if (!entries.length) return `<p>No rank data captured.</p>`;
      return entries.map(([rankId, row]) => {
        const levels = Object.entries(row.levels || {});
        return `<details><summary>${esc(niceKey(rankId))} &middot; ${levels.length} levels</summary><div class="table-scroll"><table><thead><tr><th>Level</th><th>Requirement</th><th>Open / Costs</th></tr></thead><tbody>${levels.map(([level, payload]) => `<tr><td>${esc(level)}</td><td><div class="kv">${pretty(payload.req)}</div></td><td><div class="kv">${pretty(payload.open)}</div></td></tr>`).join("")}</tbody></table></div></details>`;
      }).join("");
    }

    function jumpToUnit(id) {
      state.view = "units";
      state.query = id;
      state.filter = "all";
      state.factionFilter = "all";
      state.selected = `units:${id}`;
      $("query").value = id;
      document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.view === "units"));
      render();
    }

    function selectAsset(path) {
      state.selected = `assets:${path}`;
      renderListAndDetail();
      window.scrollTo({top: 0, behavior: "smooth"});
    }

    function selectSkin(id) {
      state.selected = `skins:${id}`;
      renderListAndDetail();
      window.scrollTo({top: 0, behavior: "smooth"});
    }

    // Loaded via <script src="images/overrides/manifest.js"> below, which sets
    // window.OVERRIDE_MANIFEST. This works when index.html is opened directly
    // by double-clicking it (file://), unlike fetch() which browsers block for
    // local files.
    overrideManifest = window.OVERRIDE_MANIFEST || {};

    function buildAuditRows() {
      const troopStats = ["HP", "DMG", "ACC", "Range", "Reload", "Speed"];
      const expectedStatsByType = {
        infantry: [...troopStats, "Evasion"],
        stormtroopers: [...troopStats, "Armor"],
        "heavy infantry": [...troopStats, "Armor"],
        special: [...troopStats, "Evasion"],
        heroes: [...troopStats, "Armor", "Evasion"],
        vehicles: [...troopStats, "Armor", "Evasion"],
        "heavy machinery": [...troopStats, "Armor", "Evasion"]
      };
      const stationaryTypes = new Set(["defender", "bunker", "boss"]);
      return views.units.map(unit => {
        const issues = [];
        const stats = unit.stats || {};
        const isPlaceholder = !!unit._soldierEntry;
        const type = (unit.unit_type_name || "").trim().toLowerCase();
        const expectedStats = expectedStatsByType[type] || (stationaryTypes.has(type) ? ["HP", "Armor"] : []);
        (unit._sourceMalformedStats || []).forEach(value => issues.push(`Malformed source value ${value}`));
        if (isPlaceholder) issues.push("Placeholder soldier component, not a standalone purchasable unit");
        if ((!unit.name || unit._sourceNameMissing) && !isPlaceholder) issues.push("Missing display name");
        expectedStats.forEach(stat => {
          const value = stats[stat];
          if (value === undefined || value === null || value === "") issues.push(`Missing ${stat}`);
          else if (typeof value === "string" && !Number.isFinite(Number(value))) issues.push(`Malformed ${stat}: ${value}`);
        });
        if (!unit.unit_type_name && !isPlaceholder) issues.push("Missing unit type/category");
        if (!unit.icon && !overrideManifest[String(unit.id)]) issues.push("Missing image reference");
        if (!issues.length) return null;
        const hasMalformed = issues.some(issue => issue.startsWith("Malformed"));
        const hasEmptyStats = issues.some(issue => issue.startsWith("Missing ") && expectedStats.includes(issue.slice(8)));
        const severity = isPlaceholder ? "low" : (hasMalformed || hasEmptyStats ? "high" : "medium");
        let recommendation = "Verify the record against the original game export, then repair only confirmed fields.";
        if (isPlaceholder) recommendation = "Keep in the soldier-component catalog; do not promote to a standalone unit without a verified name and ownership link.";
        else if (hasMalformed) recommendation = "Correct the source value format first, then regenerate the wiki data.";
        else if (hasEmptyStats) recommendation = "Find the corresponding raw game/config record or mark the stat as intentionally unavailable; do not infer combat values.";
        else if (issues.some(issue => issue === "Missing image reference")) recommendation = "Check the preview asset or add a verified local image override.";
        return {
          id: String(unit.id),
          name: unit.name || (isPlaceholder ? `Soldier ${unit.id}` : "Unnamed record"),
          preview: unit.preview || "",
          icon: unit.icon || "",
          unit_type_name: unit.unit_type_name || "",
          severity,
          issues,
          issueSummary: issues.join("; "),
          recommendation,
          reference: `units_full.json:${unit.id}`
        };
      }).filter(Boolean);
    }
    views.audit = buildAuditRows();
    init();
  </script>
</body>
</html>
