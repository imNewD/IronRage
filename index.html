                  const text = ev.killed ? `-${ev.dealt} ☠` : `-${ev.dealt}`;
                  combatFloatText(ev.cellIndex, text, ev.killed ? "combat-float-kill" : "combat-float-hit");
                } else {
                  combatFloatText(ev.cellIndex, "MISS", "combat-float-miss");
                }
              }, i * 220);
            });
            return;
          }
        }
        if (clicked) {
          combatGridState.selectedInstanceId = clicked.id;
          renderCombatGrid();
          return;
        }
        const moveDist = Math.max(Math.abs(row - selected.row), Math.abs(col - selected.col));
        if (moveDist > 0 && moveDist <= (selected.movesLeft || 0)) {
          selected.row = row;
          selected.col = col;
          selected.movesLeft = Math.max(0, (selected.movesLeft || 0) - moveDist);
          renderCombatGrid();
          return;
        }
        combatGridState.selectedInstanceId = null;
        renderCombatGrid();
        return;
      }

      if (clicked) {
        combatGridState.selectedInstanceId = clicked.id;
      } else {
        // No unit selected and the square's empty: this click sets the current
        // team's spawn point instead (see the Start button toggle + spawnPoints).
        combatGridState.spawnPoints[combatGridState.spawnTeam] = { row, col };
      }
      renderCombatGrid();
    }

    function renderCombatGrid() {
      hideCombatBattlePopover(); // stale cell refs after a re-render, so drop any open hover card
      document.querySelector(".app").classList.remove("has-side");
      const selectedId = combatGridState.selectedInstanceId;
      const selected = selectedId != null ? combatGridState.instances.find(inst => inst.id === selectedId) : null;
      const selectedUnit = selected ? findUnitById(selected.unitId) : null;
      const selectedRange = selectedUnit ? Number(computedStats(selectedUnit).Range || 0) : 0;
      const selectedViewRange = selectedUnit ? unitViewRange(selectedUnit) : 0;
      const moveTargets = new Set();
      const attackTargets = new Set();
      const rangeTargets = new Set(); // blue ring: everything within view range, regardless of move/attack/occupancy
      if (selected) {
        const budget = Math.max(0, selected.movesLeft || 0);
        for (let dr = -budget; dr <= budget; dr++) {
          for (let dc = -budget; dc <= budget; dc++) {
            const dist = Math.max(Math.abs(dr), Math.abs(dc));
            if (dist === 0 || dist > budget) continue;
            const r = selected.row + dr, c = selected.col + dc;
            if (r < 0 || c < 0 || r >= COMBAT_GRID_ROWS || c >= COMBAT_GRID_COLS) continue;
            if (!combatInstanceAt(r, c)) moveTargets.add(r * COMBAT_GRID_COLS + c);
          }
        }
        combatGridState.instances.forEach(inst => {
          if (inst.team !== selected.team && isNearestAttackTarget(selected, selectedRange, inst)) {
            attackTargets.add(inst.row * COMBAT_GRID_COLS + inst.col);
          }
        });
        // Only the outer ring (cells exactly selectedViewRange away) gets the
        // border class, so the range reads as an outline rather than a filled
        // block of individually-bordered cells.
        for (let dr = -selectedViewRange; dr <= selectedViewRange; dr++) {
          for (let dc = -selectedViewRange; dc <= selectedViewRange; dc++) {
            const dist = Math.max(Math.abs(dr), Math.abs(dc));
            if (dist !== selectedViewRange) continue;
            const r = selected.row + dr, c = selected.col + dc;
            if (r < 0 || c < 0 || r >= COMBAT_GRID_ROWS || c >= COMBAT_GRID_COLS) continue;
            rangeTargets.add(r * COMBAT_GRID_COLS + c);
          }
        }
      }
      const cellsHTML = [];
      const total = COMBAT_GRID_COLS * COMBAT_GRID_ROWS;
      for (let i = 0; i < total; i++) {
        const row = Math.floor(i / COMBAT_GRID_COLS), col = i % COMBAT_GRID_COLS;
        const inst = combatInstanceAt(row, col);
        const classes = ["combat-cell"];
        if (moveTargets.has(i)) classes.push("combat-cell-move");
        if (attackTargets.has(i)) classes.push("combat-cell-attack");
        if (rangeTargets.has(i)) classes.push("combat-cell-range");
        if (!inst) {
          if (combatGridState.spawnPoints.blue && combatGridState.spawnPoints.blue.row === row && combatGridState.spawnPoints.blue.col === col) classes.push("combat-cell-spawn-blue");
          if (combatGridState.spawnPoints.red && combatGridState.spawnPoints.red.row === row && combatGridState.spawnPoints.red.col === col) classes.push("combat-cell-spawn-red");
        }
        let tokenHTML = "";
        if (inst) {
          const unit = findUnitById(inst.unitId);
          const pct = Math.max(0, Math.min(100, Math.round((inst.hp / inst.maxHp) * 100)));
          const hpClass = pct <= 25 ? "combat-hp-low" : pct <= 60 ? "combat-hp-mid" : "combat-hp-high";
          const isSelected = selected && inst.id === selected.id;
          classes.push(`combat-cell-occupied combat-team-${inst.team}${isSelected ? " combat-cell-selected" : ""}`);
          const squadBadge = (inst.count || 1) > 1 ? `<span class="combat-squad-badge">x${inst.count}</span>` : "";
          tokenHTML = unit ? `
            <div class="combat-token-wrap">
              ${unitImg(unit, "combat-token")}
              <div class="combat-hp-track"><div class="combat-hp-fill ${hpClass}" style="width:${pct}%"></div></div>
            </div>${squadBadge}` : "";
        }
        cellsHTML.push(`<div class="${classes.join(" ")}" data-cell="${i}">${tokenHTML}</div>`);
      }
      const cellSize = combatGridState.cellSize;
      const colRulerHTML = Array.from({ length: COMBAT_GRID_COLS }, (_, c) => `<div class="combat-ruler-cell">${esc(combatColumnLabel(c))}</div>`).join("");
      const rowRulerHTML = Array.from({ length: COMBAT_GRID_ROWS }, (_, r) => `<div class="combat-ruler-cell">${r + 1}</div>`).join("");
      // Fill as much of the viewport as is actually available (same measure-then-size
      // approach as the registry book), so the map reads as a proper battlefield
      // instead of a small fixed box — it still scrolls/pans within that if the
      // zoomed-in grid is bigger than the space it's given.
      const detailTop = $("detail").getBoundingClientRect().top;
      const wrapHeight = Math.max(280, window.innerHeight - detailTop - 24);
      $("detail").innerHTML = `
        <div class="combat-grid-wrap" style="height: ${wrapHeight}px; --cell-size: ${cellSize}px; --combat-cols: ${COMBAT_GRID_COLS}; --combat-rows: ${COMBAT_GRID_ROWS};">
          <div class="combat-toolbar">
            <span class="meta">Click Start to pick a team, then click an empty square to set that team's spawn point. Drag units from the left onto the grid to place them anywhere — if a square's taken, they land in the nearest open one. Click a placed unit to move (green, based on remaining speed) or attack (red, closest enemy only) — blue shows its view range.</span>
            <div class="combat-toolbar-actions">
              <div class="combat-zoom-controls">
                <button type="button" class="combat-zoom-btn" id="combat-zoom-out" ${cellSize <= COMBAT_CELL_SIZE_MIN ? "disabled" : ""} title="Zoom out">&minus;</button>
                <span class="combat-zoom-label">${cellSize}px</span>
                <button type="button" class="combat-zoom-btn" id="combat-zoom-in" ${cellSize >= COMBAT_CELL_SIZE_MAX ? "disabled" : ""} title="Zoom in">&plus;</button>
              </div>
              <div class="combat-team-picker">
                <button type="button" class="combat-start-btn combat-team-${combatGridState.spawnTeam}" id="combat-team-toggle">Start</button>
              </div>
              <span class="combat-turn-indicator">Turn ${combatGridState.turn}</span>
              <button type="button" class="btn-under-card" id="combat-end-turn">End Turn</button>
              <button type="button" class="btn-under-card" id="combat-grid-clear">Clear grid</button>
            </div>
          </div>
          <div class="combat-grid-rulers">
            <div class="combat-grid-corner"></div>
            <div class="combat-ruler-cols">${colRulerHTML}</div>
            <div class="combat-ruler-rows">${rowRulerHTML}</div>
            <div class="combat-grid">${cellsHTML.join("")}</div>
          </div>
        </div>`;
      $("side-panel").innerHTML = "";
      $("combat-zoom-out").addEventListener("click", () => {
        combatGridState.cellSize = Math.max(COMBAT_CELL_SIZE_MIN, combatGridState.cellSize - 7);
        renderCombatGrid();
      });
      $("combat-zoom-in").addEventListener("click", () => {
        combatGridState.cellSize = Math.min(COMBAT_CELL_SIZE_MAX, combatGridState.cellSize + 7);
        renderCombatGrid();
      });
      $("combat-team-toggle").addEventListener("click", () => {
        combatGridState.spawnTeam = combatGridState.spawnTeam === "blue" ? "red" : "blue";
        renderCombatGrid();
      });
      $("combat-end-turn").addEventListener("click", () => {
        combatGridState.turn += 1;
        combatGridState.instances.forEach(startUnitTurn); // refills both movement AND attack-time budgets for the new turn
        renderCombatGrid();
      });
      $("combat-grid-clear").addEventListener("click", () => {
        combatGridState.instances = [];
        combatGridState.selectedInstanceId = null;
        combatGridState.spawnPoints = { blue: null, red: null };
        combatGridState.turn = 1;
        renderCombatGrid();
      });
      const gridEl = $("detail").querySelector(".combat-grid");
      gridEl.addEventListener("click", combatGridClick);
      gridEl.addEventListener("mouseover", (event) => {
        const cellEl = event.target.closest(".combat-cell-occupied");
        if (!cellEl) return;
        const i = Number(cellEl.dataset.cell);
        const inst = combatInstanceAt(Math.floor(i / COMBAT_GRID_COLS), i % COMBAT_GRID_COLS);
        if (!inst || inst.id === combatHoverInstanceId) return;
        showCombatBattlePopover(cellEl, inst);
      });
      gridEl.addEventListener("mouseout", (event) => {
        const cellEl = event.target.closest(".combat-cell-occupied");
        if (!cellEl) return;
        if (event.relatedTarget && cellEl.contains(event.relatedTarget)) return;
        hideCombatBattlePopover();
      });
      gridEl.addEventListener("dragover", (event) => {
        const cellEl = event.target.closest(".combat-cell");
        if (!cellEl) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "copy";
        cellEl.classList.add("combat-cell-dragover");
      });
      gridEl.addEventListener("dragleave", (event) => {
        const cellEl = event.target.closest(".combat-cell");
        if (cellEl) cellEl.classList.remove("combat-cell-dragover");
      });
      gridEl.addEventListener("drop", (event) => {
        const cellEl = event.target.closest(".combat-cell");
        if (!cellEl) return;
        event.preventDefault();
        cellEl.classList.remove("combat-cell-dragover");
        const unitId = event.dataTransfer.getData("text/plain");
        if (!unitId) return;
        const index = Number(cellEl.dataset.cell);
        spawnUnitOnGrid(unitId, { row: Math.floor(index / COMBAT_GRID_COLS), col: index % COMBAT_GRID_COLS });
      });
    }


    // Registry book: an alternate center+right view showing every filtered unit
    // as a portrait card across two book "pages" (still respects the aside's
    // search/filter/category state). Clicking a card exits the book and opens
    // that unit in the normal detail view. Kept deliberately simple — no
    // discovered/locked state exists in the captured data, so every matching
    // unit just shows its own portrait.
    const REGISTRY_COLS = 5;
    function renderRegistryBook(rows, rowCountOverride) {
      document.querySelector(".app").classList.add("has-side");
      // Measure actual available space (detail's position varies with topbar
      // height etc.) rather than guessing with constants, so the book fills
      // exactly to the bottom with no leftover gap and no clipped row.
      const detailTop = $("detail").getBoundingClientRect().top;
      const wrapHeight = Math.max(200, window.innerHeight - detailTop - 24);
      const rowCount = rowCountOverride || Math.max(2, Math.min(12, Math.floor(wrapHeight / 90)));
      const perSide = rowCount * REGISTRY_COLS;
      const pageSize = perSide * 2;
      const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
      state.registryPage = Math.min(state.registryPage, totalPages - 1);
      const leftRows = rows.slice(state.registryPage * pageSize, state.registryPage * pageSize + perSide);
      const rightRows = rows.slice(state.registryPage * pageSize + perSide, state.registryPage * pageSize + pageSize);
      const pageHtml = (pageRows) => {
        const totalCells = rowCount * REGISTRY_COLS;
        const blankCells = Math.max(0, totalCells - pageRows.length);
        return `
        <div class="registry-page">
          <div class="registry-page-title">Register of troops</div>
          <div class="registry-grid" style="grid-template-rows: repeat(${rowCount}, 1fr);">
            ${pageRows.map(row => `
              <button class="registry-card${state.junkSelection.has(rowKey(row)) ? " junk-selected" : ""}" data-id="${esc(rowKey(row))}" title="">
                ${unitImg(row)}
              </button>`).join("")}
            ${Array(blankCells).fill(0).map(() => `<div class="registry-blank"></div>`).join("")}
          </div>
        </div>`;
      };
      const compareUnit = state.compareSourceId ? findUnitById(state.compareSourceId) : null;
      const bannerHtml = compareUnit ? `
        <div class="compare-banner" id="compare-banner">
          <span>Comparing <strong>${esc(compareUnit.name)}</strong> — pick a unit to compare it with</span>
          <button type="button" id="compare-cancel">Cancel</button>
        </div>` : "";
      $("detail").innerHTML = `
        <div class="registry-wrap" style="height: ${wrapHeight}px;">
          ${bannerHtml}
          <div class="registry-book">
            ${pageHtml(leftRows)}
            ${pageHtml(rightRows)}
          </div>
          <div class="registry-nav">
            <button type="button" id="registry-prev" ${state.registryPage === 0 ? "disabled" : ""}>&larr;</button>
            <span>${rows.length ? state.registryPage * pageSize + 1 : 0}-${Math.min(rows.length, (state.registryPage + 1) * pageSize)} / ${rows.length}</span>
            <button type="button" id="registry-next" ${state.registryPage >= totalPages - 1 ? "disabled" : ""}>&rarr;</button>
          </div>
        </div>`;
      if (!rowCountOverride) {
        // First pass used an estimate before the nav row's real height was known;
        // re-measure now that it's in the DOM and redo the layout if it's off.
        const wrap = $("detail").querySelector(".registry-wrap");
        const nav = $("detail").querySelector(".registry-nav");
        if (wrap && nav) {
          const banner = $("compare-banner");
          const bannerH = banner ? banner.getBoundingClientRect().height + 10 : 0;
          const availableForBook = wrapHeight - nav.getBoundingClientRect().height - 16 - bannerH;
          const pageTitle = $("detail").querySelector(".registry-page-title");
          const titleH = pageTitle ? pageTitle.getBoundingClientRect().height + 12 : 0;
          const gridAvail = availableForBook - 40 - titleH;
          const refinedRowCount = Math.max(2, Math.min(12, Math.floor(gridAvail / 90)));
          if (refinedRowCount !== rowCount) {
            renderRegistryBook(rows, refinedRowCount);
            return;
          }
        }
      }
      $("side-panel").innerHTML = "";
      let popoverEl = null;
      const closePopover = () => { if (popoverEl) { popoverEl.remove(); popoverEl = null; } };
      $("detail").querySelectorAll(".registry-card").forEach(btn => {
        const rowId = btn.dataset.id;
        const row = rows.find(r => rowKey(r) === rowId);
        btn.addEventListener("mouseenter", () => {
          if (!row) return;
          closePopover();
          const realAbilities = (row.abilities || []).filter(a => a.icon && a.description);
          const ability = realAbilities[0];
          const statsHTML = Object.keys(statIconViews)
            .filter(stat => row.stats && row.stats[stat] !== undefined)
            .slice(0, 5)
            .map(stat => `<span class="combat-stat">${statIcon(stat)}${esc(fmt(row.stats[stat]))}</span>`).join("");
          popoverEl = document.createElement("div");
          popoverEl.className = "registry-popover";
          popoverEl.innerHTML = `
            <div class="combat-head">
              <div class="combat-portrait-frame ${(row.equipment_slots || []).length ? "portrait-hero" : "portrait-base"}">${combatPortraitViewport(unitImg(row, "combat-portrait"))}</div>
              <div class="combat-name"><strong${nameColorStyle(row.name)}>${esc(row.name || "")}</strong><span class="combat-type-row"><span class="combat-type-label">${esc(row.unit_type_name || rarityNames[row.rarity] || "Unit")}</span></span></div>
            </div>
            <div class="combat-stats">${statsHTML}</div>
            <div class="combat-rule"></div>
            <p class="combat-description">${esc(row.description || "")}</p>
            ${ability ? `<div class="combat-ability">${img(ability.icon, "")}<div><strong>${esc(ability.name)}</strong><p>${esc(ability.description || "")}</p></div></div>` : ""}
          `;
          document.body.appendChild(popoverEl);
          const rect = btn.getBoundingClientRect();
          const popW = 340;
          let left = rect.left + rect.width / 2 - popW / 2;
          left = Math.max(8, Math.min(left, window.innerWidth - popW - 8));
          let top = rect.bottom + 8;
          const estH = popoverEl.getBoundingClientRect().height || 260;
          if (top + estH > window.innerHeight) top = Math.max(8, rect.top - estH - 8);
          popoverEl.style.left = `${left}px`;
          popoverEl.style.top = `${top}px`;
        });
        btn.addEventListener("mouseleave", closePopover);
        btn.addEventListener("click", () => {
          closePopover();
          if (state.junkMode) {
            toggleJunkSelection(rowId);
            return;
          }
          // Registry grid is still a valid way to pick a compare target too
          // (browsing to a unit's full card and using "Compare with" there is
          // the primary path now, but a click here works as a shortcut).
          if (state.compareSourceId) {
            const targetId = row ? row.id : null;
            if (!targetId || String(targetId) === String(state.compareSourceId)) return;
            state.registryMode = false;
            $("registry-toggle").classList.remove("active");
            finishCompare(targetId);
            return;
          }
          state.selected = btn.dataset.id;
          state.registryMode = false;
          $("registry-toggle").classList.remove("active");
          renderListAndDetail();
        });
      });
      const compareCancel = $("compare-cancel");
      if (compareCancel) {
        compareCancel.addEventListener("click", () => {
          state.registryMode = false;
          $("registry-toggle").classList.remove("active");
          cancelCompare();
        });
      }
      const prevBtn = $("registry-prev");
      const nextBtn = $("registry-next");
      if (prevBtn) prevBtn.addEventListener("click", () => { closePopover(); state.registryPage--; renderListAndDetail(); });
      if (nextBtn) nextBtn.addEventListener("click", () => { closePopover(); state.registryPage++; renderListAndDetail(); });
    }

    function findUnitById(unitId) {
      return views.units.find(u => String(u.id) === String(unitId));
    }

    // Starting a compare no longer forces the registry grid — it stays on the
    // normal browsing view (list + detail) so search, filters, and clicking into
    // any unit's full card all keep working exactly as they do outside compare
    // mode. A banner tracks the in-progress comparison; picking a target happens
    // via the "Compare with X" action that appears on whichever unit you land on.
    function startCompare(unitId) {
      state.compareSourceId = unitId;
      state.selected = `units:${unitId}`;
      renderListAndDetail();
    }

    function cancelCompare() {
      const sourceId = state.compareSourceId;
      state.compareSourceId = null;
      state.selected = sourceId ? `units:${sourceId}` : state.selected;
      renderListAndDetail();
    }

    function finishCompare(targetId) {
      const sourceId = state.compareSourceId;
      if (!sourceId) return;
      state.compareSourceId = null;
      renderListAndDetail();
      openCompareModal(sourceId, targetId);
    }

    function compareBannerHTML() {
      if (!state.compareSourceId) return "";
      const compareUnit = findUnitById(state.compareSourceId);
      if (!compareUnit) return "";
      return `
        <div class="compare-banner" id="compare-banner">
          <span>Comparing <strong>${esc(compareUnit.name)}</strong> — browse or search for a unit, then use "Compare with" on it</span>
          <button type="button" onclick="cancelCompare()">Cancel</button>
        </div>`;
    }

    // Reload is time-to-fire-again: lower means the unit shoots more often, so
    // it's the one stat here where "less" is the better/green side.
    const LOWER_IS_BETTER_STATS = new Set(["Reload"]);

    // Shows every stat either unit has (including ones a user has toggled off
    // on their own card), always the raw current-level values from
    // computedStats — that's what "which unit is better right now" means.
    function openCompareModal(sourceId, targetId) {
      document.querySelectorAll(".compare-modal-backdrop").forEach(el => el.remove());
      const sourceUnit = findUnitById(sourceId);
      const targetUnit = findUnitById(targetId);
      if (!sourceUnit || !targetUnit) return;
      initLiveStateForUnit(sourceUnit);
      initLiveStateForUnit(targetUnit);
      const leftStats = computedStats(sourceUnit);
      const rightStats = computedStats(targetUnit);
      const compareRow = (leftLabel, rightLabel, iconHtml, lv, rv, lowerIsBetter) => {
        let leftClass = "", rightClass = "";
        const leftWins = lowerIsBetter ? lv < rv : lv > rv;
        const rightWins = lowerIsBetter ? rv < lv : rv > lv;
        if (leftWins) { leftClass = "compare-better"; rightClass = "compare-worse"; }
        else if (rightWins) { rightClass = "compare-better"; leftClass = "compare-worse"; }
        return `<div class="compare-stat-row">
          <span class="compare-stat-val ${leftClass}">${esc(leftLabel)}</span>
          <span class="compare-stat-label">${iconHtml}</span>
          <span class="compare-stat-val ${rightClass}">${esc(rightLabel)}</span>
        </div>`;
      };
      const leftSquad = (typeof SQUAD_COUNTS !== "undefined") ? SQUAD_COUNTS[String(sourceUnit.id)] : undefined;
      const rightSquad = (typeof SQUAD_COUNTS !== "undefined") ? SQUAD_COUNTS[String(targetUnit.id)] : undefined;
      const squadRow = (leftSquad !== undefined || rightSquad !== undefined)
        ? compareRow(
            leftSquad !== undefined ? String(leftSquad) : "—",
            rightSquad !== undefined ? String(rightSquad) : "—",
            `<img class="squad-icon" src="${esc(SQUAD_ICON_PATH)}" onerror="this.style.visibility='hidden'"> Unit count`,
            Number(leftSquad || 0), Number(rightSquad || 0), false
          )
        : "";
      const allStats = cardStats.filter(stat => leftStats[stat] !== undefined || rightStats[stat] !== undefined);
      const statRows = allStats.map(stat => {
        const lv = Number(leftStats[stat] || 0);
        const rv = Number(rightStats[stat] || 0);
        return compareRow(fmt(lv), fmt(rv), `${statIcon(stat)}${esc(niceKey(stat))}`, lv, rv, LOWER_IS_BETTER_STATS.has(stat));
      }).join("");
      const abilitiesHtml = (unit) => {
        const realAbilities = (unit.abilities || []).filter(a => a.icon && a.description);
        if (!realAbilities.length) return "";
        return `<div class="compare-abilities">${realAbilities.map(a => `<img src="${esc(a.icon)}" title="${esc(a.name || "")}${a.name ? ' — ' : ''}${esc(a.description || "")}" onerror="this.style.visibility='hidden'">`).join("")}</div>`;
      };
      const sideHtml = (unit) => `
        <div class="compare-side">
          <div class="combat-portrait-frame ${(unit.equipment_slots || []).length ? "portrait-hero" : "portrait-base"}">${combatPortraitViewport(unitImg(unit, "combat-portrait"))}</div>
          <strong${nameColorStyle(unit.name)}>${esc(unit.name)}</strong>
          <span class="combat-type-label">${esc(unit.unit_type_name || rarityNames[unit.rarity] || "Unit")}</span>
          ${abilitiesHtml(unit)}
        </div>`;
      const backdrop = document.createElement("div");
      backdrop.className = "compare-modal-backdrop";
      backdrop.innerHTML = `
        <div class="compare-modal">
          <button type="button" class="compare-modal-close" id="compare-modal-close">&times;</button>
          <div class="compare-modal-title">Comparison</div>
          <div class="compare-modal-grid">
            ${sideHtml(sourceUnit)}
            <div class="compare-stats-col">${squadRow}${statRows}</div>
            ${sideHtml(targetUnit)}
          </div>
        </div>`;
      document.body.appendChild(backdrop);
      const close = () => backdrop.remove();
      backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
      $("compare-modal-close").addEventListener("click", close);
    }

    function rowButton(row) {
      const sub = state.view === "assets" ? row.category : `ID ${row.id || ""}`;
      const thumb = state.view === "units" ? unitImg(row) : img(row.icon || row.path || "");
      // In combat mode, unit rows become drag sources so they can be dropped directly
      // onto a grid square (see the "dragstart" delegate on #list and the grid's
      // "drop" handler in renderCombatGrid) instead of always spawning at a fixed cell.
      const draggableAttrs = (state.combatMode && state.view === "units") ? ` draggable="true"` : "";
      const junkClass = state.junkSelection.has(rowKey(row)) ? " junk-selected" : "";
      return `<button class="row${junkClass}" data-id="${esc(rowKey(row))}"${draggableAttrs}>${thumb}<span><span class="row-title"${nameColorStyle(titleOf(row))}>${esc(titleOf(row))}</span><span class="row-sub">${esc(sub)}</span></span></button>`;
    }

    function renderDetail(row, count) {
      document.querySelector(".app").classList.toggle("has-side", state.view === "units" && !!row);
      if (!row) {
        $("detail").innerHTML = `<div class="empty">No entry selected</div>`;
        $("side-panel").innerHTML = "";
        return;
      }
      if (state.view === "units") renderUnit(row, count);
      if (state.view === "support") renderSupport(row, count);
      if (state.view === "equipment") renderEquipment(row, count);
      if (state.view === "skins") renderSkin(row, count);
      if (state.view === "assets") renderAsset(row, count);
      if (state.view === "audit") renderAudit(row, count);
      if (state.view !== "units") $("side-panel").innerHTML = "";
    }

    function initLiveStateForUnit(unit) {
      if (liveState[unit.id]) return liveState[unit.id];
      const entry = { training: {}, equipment: {}, loadout: {}, mods: {}, skin: -1, customAbilities: [], hiddenStats: new Set(hiddenStatsCache[unit.id] || []), rankTier: null };
      // Seed the sliders/gear picks from the global L / E simulation (if set) so opening
      // a unit reflects what the list is currently sorted/filtered by, instead of always
      // starting back at base stats. Clamped per-stat/per-slot to what that unit actually has.
      if (state.levelValue != null) {
        Object.entries(unit.training || {}).forEach(([stat, tiers]) => {
          entry.training[stat] = Math.min(state.levelValue, (tiers || []).length);
        });
      }
      if (state.equipConfig && (unit.equipment_slots || []).length) {
        const slots = unit.equipment_slots || [];
        const n = Math.min(state.equipConfig.count, slots.length);
        for (let i = 0; i < n; i++) {
          const options = slots[i].options || [];
          if (!options.length) continue;
          entry.equipment[i] = Math.min(state.equipConfig.level, options.length - 1);
        }
      }
      // A previously-saved gear build takes priority over the "Live Levels" simulation
      // seed above — if the user explicitly equipped/modded/skinned this unit before,
      // restore exactly that instead of the generic simulated loadout.
      const saved = liveBuildCache[unit.id];
      if (saved) {
        if (saved.equipment) Object.assign(entry.equipment, saved.equipment);
        if (saved.loadout) Object.assign(entry.loadout, saved.loadout);
        if (saved.mods) entry.mods = JSON.parse(JSON.stringify(saved.mods));
        if (saved.skin !== undefined && saved.skin !== null) entry.skin = saved.skin;
      }
      liveState[unit.id] = entry;
      return entry;
    }

    function renderUnit(unit, count) {
      initLiveStateForUnit(unit);
      const realAbilities = (unit.abilities || []).filter(a => a.icon && a.description);
      const cardEquipHTML = equipmentIconGrid(unit, "card");
      const cardSkinHTML = skinSlotHTML(unit, "card");
      const isCompareSource = state.compareSourceId && String(state.compareSourceId) === String(unit.id);
      const isCompareTarget = state.compareSourceId && !isCompareSource;
      let underCardActionsHtml;
      if (isCompareSource) {
        underCardActionsHtml = `
          <div class="under-card-actions">
            <span class="btn-under-card btn-compare-active">Comparing this unit — pick another below</span>
            <button type="button" class="btn-under-card" onclick="cancelCompare()">Cancel</button>
          </div>`;
      } else if (isCompareTarget) {
        const sourceUnit = findUnitById(state.compareSourceId);
        underCardActionsHtml = `
          <div class="under-card-actions">
            <button type="button" class="btn-under-card btn-compare-target" onclick="finishCompare('${esc(unit.id)}')" title="Compare this unit against ${esc(sourceUnit ? sourceUnit.name : "")}">&#8646; Compare with ${esc(sourceUnit ? sourceUnit.name : "other unit")}</button>
            <button type="button" class="btn-under-card" onclick="cancelCompare()">Cancel</button>
          </div>`;
      } else {
        underCardActionsHtml = `
          <div class="under-card-actions">
            <button type="button" class="btn-under-card" onclick="startCompare('${esc(unit.id)}')" title="Compare this unit against another">&#8646; Compare</button>
          </div>`;
      }
      $("detail").innerHTML = `
        ${compareBannerHTML()}
        <div class="unit-stage">
          <section class="combat-card" id="combat-card-${esc(unit.id)}">
            <div class="combat-head">
              <div class="combat-portrait-frame ${(unit.equipment_slots || []).length ? "portrait-hero" : "portrait-base"}">${combatPortraitViewport(unitImg(unit, "combat-portrait", `id="combat-portrait-${esc(unit.id)}"`))}</div>
              <div class="combat-name"><strong id="combat-name-${esc(unit.id)}" class="editable-stat" title="Click to edit name" onclick="openNameEditPopup('${esc(unit.id)}')"${nameColorStyle(unit.name)}>${esc(liveState[unit.id]?.nameOverride ?? unit.name)}</strong><span class="combat-type-row"><span class="combat-type-label">${esc(unit.unit_type_name || rarityNames[unit.rarity] || "Unit")}</span>${squadCountBadge(unit)}</span></div>
              <div class="combat-level-col">
                <div class="combat-level" id="live-level-${esc(unit.id)}">Lvl.1</div>
              </div>
            </div>
            <div class="combat-stats" id="live-card-stats-${esc(unit.id)}"></div>
            <div class="combat-rule"></div>
            <p class="combat-description editable-stat" id="description-${esc(unit.id)}" title="Click to edit description" onclick="openDescriptionEditPopup('${esc(unit.id)}')">${esc(liveState[unit.id]?.descriptionOverride ?? (unit.description || "No description captured."))}</p>
            <div id="ability-list-${esc(unit.id)}">${abilityListHTML(unit, realAbilities)}</div>
            <div class="combat-rule" id="combat-rule-equip-${esc(unit.id)}" style="${cardEquipHTML ? "" : "display:none;"}"></div>
            <div class="combat-equipment" id="combat-equipment-${esc(unit.id)}">${cardEquipHTML}</div>
            <div class="combat-rule" id="combat-rule-skin-${esc(unit.id)}" style="${cardSkinHTML ? "" : "display:none;"}"></div>
            <div id="skin-block-${esc(unit.id)}-card">${cardSkinHTML}</div>
          </section>
          ${underCardActionsHtml}
        </div>
        <div class="two-col">
          <section>
            <details class="collapsible-section">
              <summary><h3>Training Growth</h3></summary>
              ${trainingTable(unit.training)}
            </details>
            <details class="collapsible-section">
              <summary><h3>Rank Progress</h3></summary>
              ${rankTables(unit.rank)}
            </details>

          </section>
        </div>`;
      $("side-panel").innerHTML = `
        <h3>Live Levels</h3>
        ${statToggleRowHTML(unit)}
        ${trainingControls(unit)}
        ${rankTierControlsHTML(unit)}
        ${rosterHTML(unit)}
        <h3>Equipped Gear</h3>
        <div id="gear-summary-${esc(unit.id)}">${equipmentIconGrid(unit, "live")}</div>
        <h3>Presets</h3>
        ${presetsHTML(unit.id)}
        <h3>Equipped Skin</h3>
        <div id="skin-block-${esc(unit.id)}-live">${skinSlotHTML(unit, "live")}</div>
        <div id="custom-abilities-${esc(unit.id)}">${addAbilityLinkHTML(unit, realAbilities)}</div>
        ${researchSectionHTML(unit)}
        <div class="badges"><span class="badge">ID ${esc(unit.id)}</span><span class="badge">Elite ${esc(unit.elite)}</span><span class="badge">${count} shown</span></div>`;
      attachLiveControls(unit);
      attachResearchGroupToggles();
      updateLiveUnit(unit);
      setupPortraitPanZoom(unit.id);
    }

    // Zoom/pan for the main detail portrait — scroll/pinch to zoom, drag to
    // reposition, double-click to reset. Purely a viewing convenience: it lives
    // in memory only (portraitViewState) and is never saved, so it resets on
    // reload or when a different unit is opened.
    const portraitViewState = {};
    const PORTRAIT_MIN_SCALE = 1;
    const PORTRAIT_MAX_SCALE = 3.5;
    function applyPortraitTransform(unitId) {
      const portraitEl = $(`combat-portrait-${unitId}`);
      if (!portraitEl) return;
      const v = portraitViewState[unitId] || { scale: 1, x: 0, y: 0 };
      portraitEl.style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.scale})`;
    }
    function setupPortraitPanZoom(unitId) {
      const portraitEl = $(`combat-portrait-${unitId}`);
      if (!portraitEl) return;
      const frame = portraitEl.closest(".combat-portrait-frame");
      if (!frame) return;
      if (!portraitViewState[unitId]) portraitViewState[unitId] = { scale: 1, x: 0, y: 0 };
      applyPortraitTransform(unitId);
      const clampScale = (s) => Math.min(PORTRAIT_MAX_SCALE, Math.max(PORTRAIT_MIN_SCALE, s));
      frame.onwheel = (e) => {
        e.preventDefault();
        const v = portraitViewState[unitId];
        const next = clampScale(v.scale - e.deltaY * 0.0025);
        v.scale = next;
        if (next === PORTRAIT_MIN_SCALE) { v.x = 0; v.y = 0; }
        applyPortraitTransform(unitId);
      };
      frame.ondblclick = () => { portraitViewState[unitId] = { scale: 1, x: 0, y: 0 }; applyPortraitTransform(unitId); };
      let dragging = false, startX = 0, startY = 0, origX = 0, origY = 0;
      const start = (clientX, clientY) => {
        const v = portraitViewState[unitId];
        if (v.scale <= PORTRAIT_MIN_SCALE) return; // nothing to pan at 1x
        dragging = true;
        startX = clientX; startY = clientY;
        origX = v.x; origY = v.y;
        frame.classList.add("panning");
      };
      const move = (clientX, clientY) => {
        if (!dragging) return;
        const v = portraitViewState[unitId];
        v.x = origX + (clientX - startX);
        v.y = origY + (clientY - startY);
        applyPortraitTransform(unitId);
      };
      const end = () => { dragging = false; frame.classList.remove("panning"); };
      frame.onmousedown = (e) => { e.preventDefault(); start(e.clientX, e.clientY); };
      frame.onmousemove = (e) => move(e.clientX, e.clientY);
      frame.onmouseup = end;
      frame.onmouseleave = end;
      frame.ontouchstart = (e) => { if (e.touches.length === 1) start(e.touches[0].clientX, e.touches[0].clientY); };
      frame.ontouchmove = (e) => { if (e.touches.length === 1) { move(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); } };
      frame.ontouchend = end;
    }

    const MOD_CAP = 2;

    function sortedGenericFirst(items) {
      return [...items].sort((a, b) => (a.units || []).length - (b.units || []).length);
    }

    function equipSlotList(unit) {
      const heroSlots = unit.equipment_slots || [];

      // Heroes have their own named slot definitions (equipment_slots). Troops don't,
      // so they fall back to the generic numbered-slot catalog below. Keep these
      // mutually exclusive — a hero should never also see the troop-catalog section.
      if (heroSlots.length) {
        return heroSlots.map((slot, i) => {
          const own = slot.options || [];
          const nonSpecific = (heroEquipmentBySlotType[slot.slot] || [])
            .filter(entry => String(entry.heroId) !== String(unit.id))
            .flatMap(entry => entry.options);
          const other = views.equipment;
          const groups = [
            { label: null, items: own, collapsedByDefault: false },
            { label: "Non specific", items: nonSpecific, collapsedByDefault: false },
            { label: "Other equipment", items: other, collapsedByDefault: true }
          ];
          const options = groups.flatMap(g => g.items);
          return {key: `hero-${i}`, section: "hero", slot: slot.slot, options, groups, picked: liveState[unit.id]?.equipment?.[i], attr: "data-equip", attrVal: i};
        });
      }

      return TROOP_SLOTS
        .map(s => {
          const own = sortedGenericFirst(equipmentBySlot[s] || []);
          const heroOwned = sortedGenericFirst(heroOwnedEquipmentBySlot[s] || []);
          const groups = [
            { label: null, items: own, collapsedByDefault: false },
            { label: "Hero gear", items: heroOwned, collapsedByDefault: true }
          ];
          const options = groups.flatMap(g => g.items);
          return {key: `troop-${s}`, section: "troop", slot: s, options, groups, picked: liveState[unit.id]?.loadout?.[s], attr: "data-loadout", attrVal: s};
        })
        .filter(entry => entry.options.length);
    }

    const EQUIP_SECTION_LABELS = { troop: "Troop gear", hero: "Hero gear" };

    function equipmentIconGrid(unit, loc) {
      let list = equipSlotList(unit);
      // The card view is a read-only summary, so only show slots that actually have
      // something equipped; empty slots stay hidden there until gear is added via the
      // live editor below, at which point updateLiveUnit() re-renders this and it appears.
      if (loc === "card") {
        list = list.filter(entry => entry.picked !== undefined && Number(entry.picked) >= 0);
      }
      if (!list.length) return "";
      const hasMultipleSections = new Set(list.map(e => e.section)).size > 1;
      let lastSection = null;
      return `${list.map((entry, idx) => {
        const domIdx = `${loc}${idx}`;
        const sectionHeader = hasMultipleSections && entry.section !== lastSection
          ? `${lastSection !== null ? "</div>" : ""}<div class="equip-section-label">${esc(EQUIP_SECTION_LABELS[entry.section] || "")}</div><div class="equip-slots">`
          : (idx === 0 ? `<div class="equip-slots">` : "");
        lastSection = entry.section;
        const item = entry.picked !== undefined && Number(entry.picked) >= 0 ? entry.options[Number(entry.picked)] : null;
        const modCount = (liveState[unit.id]?.mods?.[entry.key] || []).length;
        const noneActive = entry.picked === undefined || Number(entry.picked) < 0;
        const optionRow = (opt, j) => {
          const bonusText = Object.entries(opt.bonus || {}).map(([rawKey, value]) => `${statIcon(statIdToName[rawKey] || rawKey)}${esc(fmt(value))}`).join(" ");
          return `<div class="gear-dropdown-item ${String(entry.picked) === String(j) ? "active" : ""}" data-name="${esc((opt.name || "").toLowerCase())}" onclick="selectGear('${esc(unit.id)}','${entry.attr}','${esc(entry.attrVal)}',${j})">${img(opt.icon, "")}<div class="gear-dropdown-text"><strong>${esc(opt.name)}</strong><div class="small">${bonusText || "No bonus captured"}</div></div></div>`;
        };
        let rows;
        if (entry.groups) {
          let j = 0;
          rows = entry.groups.map((group, gIdx) => {
            const groupRows = group.items.map(opt => optionRow(opt, j++)).join("");
            if (!group.label) return groupRows;
            const groupId = `gear-group-${esc(unit.id)}-${domIdx}-${gIdx}`;
            const collapsed = !!group.collapsedByDefault;
            return `<button type="button" class="gear-dropdown-group-toggle" data-group-target="${groupId}" data-label="${esc(group.label)}" data-count="${group.items.length}" data-collapsed="${collapsed}" onclick="toggleGearGroup(this)">${esc(group.label)} (${group.items.length}) ${collapsed ? "&#9656;" : "&#9662;"}</button>
              <div class="gear-dropdown-group" id="${groupId}" ${collapsed ? "hidden" : ""}>${groupRows}</div>`;
          }).join("");
        } else {
          rows = entry.options.map((opt, j) => optionRow(opt, j)).join("");
        }
        return `${sectionHeader}<div class="equip-slot" onmouseenter="showItemTooltip(event,'${esc(unit.id)}','${esc(entry.key)}')" onmouseleave="hideGearTooltip()">
          <button type="button" class="equip-slot-btn" onclick="toggleGearDropdown('${esc(unit.id)}', '${domIdx}')" ondblclick="event.stopPropagation(); event.preventDefault(); openValueEditPopup('${esc(unit.id)}','${esc(entry.key)}')" title="Double-click to edit values">
            <img id="equip-icon-${esc(unit.id)}-${domIdx}" src="${item ? esc(item.icon) : ""}" style="${item ? "" : "display:none;"}">
            ${item ? "" : `<span class="small">Slot ${esc(entry.slot)}</span>`}
          </button>
          <span class="mod-badge" onclick="event.stopPropagation(); toggleModDropdown('${esc(unit.id)}','${domIdx}')" ondblclick="event.stopPropagation(); event.preventDefault(); openValueEditPopup('${esc(unit.id)}','${esc(entry.key)}')" onmouseenter="event.stopPropagation(); showModBadgeTooltip(event,'${esc(unit.id)}','${esc(entry.key)}')" onmouseleave="hideGearTooltip()" title="Double-click to edit values">${modCount}/${MOD_CAP}</span>
          <div class="gear-dropdown" id="gear-dropdown-${esc(unit.id)}-${domIdx}">
            <input type="text" class="gear-search" id="gear-search-${esc(unit.id)}-${domIdx}" placeholder="Search equipment…" oninput="filterGearDropdown('${esc(unit.id)}', '${domIdx}')">
            <div class="gear-dropdown-item ${noneActive ? "active" : ""}" onclick="selectGear('${esc(unit.id)}','${entry.attr}','${esc(entry.attrVal)}',-1)">None</div>
            ${rows}
          </div>
          <div class="gear-dropdown mod-dropdown" id="mod-dropdown-${esc(unit.id)}-${domIdx}">
            ${modDropdownRows(unit, entry, item, domIdx)}
          </div>
        </div>`;
      }).join("")}</div>`;
    }

    function modDropdownRows(unit, entry, item, domIdx) {
      if (!item) return `<div class="gear-dropdown-item" style="cursor:default;">Equip an item first.</div>`;
      const mods = modsForItem(item, entry);
      if (!mods.length) return `<div class="gear-dropdown-item" style="cursor:default;">No modifiers captured for this slot.</div>`;
      const selected = liveState[unit.id]?.mods?.[entry.key] || [];
      const atCap = selected.length >= MOD_CAP;
      return mods.map(m => {
        const count = selected.filter(id => id === String(m.id)).length;
        const active = count > 0;
        const priceText = m.price ? pretty(m.price) : "";
        const ability = modAbilities(m)[0];
        const countBadge = active
          ? `<span class="mod-count" onclick="event.stopPropagation(); removeModSelect('${esc(unit.id)}','${esc(domIdx)}','${esc(entry.key)}','${esc(m.id)}')" title="Remove one copy">&times;${count}</span>`
          : "";
        return `<div class="gear-dropdown-item ${active ? "active" : ""} ${atCap ? "at-cap" : ""}" onclick="addModSelect('${esc(unit.id)}','${esc(domIdx)}','${esc(entry.key)}','${esc(m.id)}')">${img(modDisplayIcon(m), "")}<div class="gear-dropdown-text"><strong class="tt-rarity-${m.rarity ?? 0}">${modLabel(m)}</strong><div class="small">${esc(rarityNames[m.rarity] || "")}${priceText ? ` &middot; ${priceText}` : ""}</div>${ability && ability.name ? `<div class="small" style="color:var(--gold2)">${esc(ability.name)}</div>` : ""}</div>${countBadge}</div>`;
      }).join("");
    }

    function clampDropdownToViewport(el) {
      if (!el) return;
      const anchor = el.parentElement;
      if (!anchor) return;
      const margin = 8;
      const anchorRect = anchor.getBoundingClientRect();
      const ddRect = el.getBoundingClientRect();
      let left = anchorRect.left;
      let top = anchorRect.bottom + 6;
      if (left + ddRect.width > window.innerWidth - margin) {
        left = window.innerWidth - margin - ddRect.width;
      }
      if (top + ddRect.height > window.innerHeight - margin) {
        const above = anchorRect.top - 6 - ddRect.height;
        top = above > margin ? above : window.innerHeight - margin - ddRect.height;
      }
      el.style.left = `${Math.max(margin, left)}px`;
      el.style.top = `${Math.max(margin, top)}px`;
    }

    function toggleModDropdown(unitId, domIdx) {
      const id = `mod-dropdown-${unitId}-${domIdx}`;
      document.querySelectorAll(".gear-dropdown.open").forEach(el => { if (el.id !== id) el.classList.remove("open"); });
      const el = $(id);
      if (!el) return;
      el.classList.toggle("open");
      if (el.classList.contains("open")) clampDropdownToViewport(el);
    }

    // Adds one copy of a mod to the slot (up to MOD_CAP total, duplicates of
    // the same mod allowed). Clicking a mod row always adds another copy;
    // use removeModSelect (the ×N badge) to take one back off.
    function addModSelect(unitId, domIdx, entryKey, modId) {
      const ls = liveState[unitId];
      ls.mods = ls.mods || {};
      const list = ls.mods[entryKey] = ls.mods[entryKey] || [];
      if (list.length < MOD_CAP) list.push(String(modId));
      saveLiveBuilds();
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (unit) updateLiveUnit(unit);
      // updateLiveUnit re-renders the whole grid (fresh, closed dropdowns), so
      // reopen this one to let the user pick/remove more than one mod in a row.
      const dd = $(`mod-dropdown-${unitId}-${domIdx}`);
      if (dd) { dd.classList.add("open"); clampDropdownToViewport(dd); }
    }

    function removeModSelect(unitId, domIdx, entryKey, modId) {
      const list = liveState[unitId]?.mods?.[entryKey];
      if (list) {
        const i = list.indexOf(String(modId));
        if (i >= 0) list.splice(i, 1);
      }
      saveLiveBuilds();
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (unit) updateLiveUnit(unit);
      const dd = $(`mod-dropdown-${unitId}-${domIdx}`);
      if (dd) { dd.classList.add("open"); clampDropdownToViewport(dd); }
    }

    // Renders a mod's named special ability (icon + bold name + description),
    // e.g. "Occult Runes" / "Restores 1% health of inflicted damage". Empty
    // string if the mod is a plain stat boost with no linked ability.
    function modAbilityHTML(mod) {
      const ability = modAbilities(mod)[0];
      if (!ability || !ability.name) return "";
      return `<div class="tt-ability-name">${esc(ability.name)}</div>${ability.description ? `<div class="tt-ability-desc">${esc(ability.description)}</div>` : ""}`;
    }

    function itemTooltipHTML(item, mods) {
      const bonusText = Object.entries(item.bonus || {}).map(([k, v]) => `<span class="tt-stat">${statIcon(statIdToName[k] || k)}${esc(fmt(v))}</span>`).join("");
      const modLines = mods.map(m => `<div class="tt-mod tt-rarity-${m.rarity ?? 0}">${modLabel(m)}</div>${modAbilityHTML(m)}`).join("");
      return `<div class="tt-title">${esc(item.name)}</div>
        ${bonusText ? `<div class="tt-stats">${bonusText}</div>` : ""}
        ${item.description ? `<div class="tt-desc">${esc(item.description)}</div>` : ""}
        ${modLines ? `<div class="tt-mods">${modLines}</div>` : ""}`;
    }

    function modBadgeTooltipHTML(mods) {
      if (!mods.length) return `<div class="tt-title">Description of modifications:</div><div class="tt-desc">No modifiers selected — click to choose.</div>`;
      const rows = mods.map(m => `<div class="tt-mod-block">
        <div class="tt-mod-row">${img(modDisplayIcon(m), "")}<span class="tt-rarity-${m.rarity ?? 0}">${modLabel(m)}</span></div>
        ${modAbilityHTML(m)}
      </div>`).join("");
      return `<div class="tt-title">Description of modifications:</div>${rows}`;
    }

    // --- Manual value editing (double-click an equipped icon or mod badge) --
    // Lets you type in a different stat value for the equipped item and/or its
    // mods, purely to theorycraft against. This is session-only — it lives in
    // liveState[unit.id].overrides and is never written to localStorage, so it
    // resets on reload (unlike the gear build itself, which now saves).
    function valueEditRowsHTML(unitId, entryKey, item, mods, overrides) {
      const itemRows = Object.entries(item?.bonus || {}).map(([rawKey, value]) => {
        const stat = statIdToName[rawKey] || rawKey;
        const ov = overrides?.item?.[rawKey];
        const current = ov !== undefined ? ov : value;
        return `<div class="value-edit-row">
          <span class="value-edit-label">${statIcon(stat)}${esc(niceKey(stat))}</span>
          <input type="number" step="any" class="value-edit-input" value="${esc(current)}" oninput="setValueOverride('${esc(unitId)}','${esc(entryKey)}','item',null,'${esc(rawKey)}',this.value)">
        </div>`;
      }).join("");
      const modRows = mods.map(mod => {
        const rows = Object.entries(mod.statBonus || {}).map(([rawKey, value]) => {
          const stat = statIdToName[rawKey] || rawKey;
          const ov = overrides?.mods?.[mod.id]?.[rawKey];
          const current = ov !== undefined ? ov : value;
          return `<div class="value-edit-row">
            <span class="value-edit-label">${statIcon(stat)}${esc(niceKey(stat))}</span>
            <input type="number" step="any" class="value-edit-input" value="${esc(current)}" oninput="setValueOverride('${esc(unitId)}','${esc(entryKey)}','mod','${esc(mod.id)}','${esc(rawKey)}',this.value)">
          </div>`;
        }).join("");
        return `<div class="value-edit-group"><div class="value-edit-group-title tt-rarity-${mod.rarity ?? 0}">${modLabel(mod)}</div>${rows || `<div class="small">No stat bonus captured.</div>`}</div>`;
      }).join("");
      if (!itemRows && !modRows) return `<div class="small">Nothing to edit — equip an item or a modifier first.</div>`;
      return `${item ? `<div class="value-edit-group"><div class="value-edit-group-title">${esc(item.name)}</div>${itemRows || `<div class="small">No stat bonus captured.</div>`}</div>` : ""}${modRows}`;
    }

    function openValueEditPopup(unitId, entryKey) {
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (!unit) return;
      const entry = equipSlotList(unit).find(e => e.key === entryKey);
      if (!entry) return;
      const item = entry.picked !== undefined && Number(entry.picked) >= 0 ? entry.options[Number(entry.picked)] : null;
      const mods = (liveState[unitId]?.mods?.[entryKey] || []).map(modById).filter(Boolean);
      document.querySelectorAll(".value-edit-modal-backdrop").forEach(el => el.remove());
      const backdrop = document.createElement("div");
      backdrop.className = "value-edit-modal-backdrop";
      backdrop.innerHTML = `
        <div class="value-edit-modal">
          <button type="button" class="compare-modal-close" id="value-edit-close">&times;</button>
          <div class="compare-modal-title">Edit values — ${esc(item ? item.name : entry.slot)}</div>
          <div class="value-edit-hint">Changes here only apply live in this session — they aren't saved anywhere.</div>
          <div id="value-edit-body">${valueEditRowsHTML(unitId, entryKey, item, mods, liveState[unitId]?.overrides?.[entryKey])}</div>
        </div>`;
      document.body.appendChild(backdrop);
      const close = () => backdrop.remove();
      backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
      $("value-edit-close").addEventListener("click", close);
    }

    function setValueOverride(unitId, entryKey, kind, modId, statKey, rawValue) {
      const ls = liveState[unitId];
      if (!ls) return;
      ls.overrides = ls.overrides || {};
      const slotOverride = ls.overrides[entryKey] = ls.overrides[entryKey] || {};
      const num = rawValue === "" ? undefined : Number(rawValue);
      if (kind === "item") {
        slotOverride.item = slotOverride.item || {};
        if (num === undefined || Number.isNaN(num)) delete slotOverride.item[statKey];
        else slotOverride.item[statKey] = num;
      } else {
        slotOverride.mods = slotOverride.mods || {};
        slotOverride.mods[modId] = slotOverride.mods[modId] || {};
        if (num === undefined || Number.isNaN(num)) delete slotOverride.mods[modId][statKey];
        else slotOverride.mods[modId][statKey] = num;
      }
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (unit) updateLiveUnit(unit);
    }

    function showItemTooltip(evt, unitId, entryKey) {
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (!unit) return;
      const entry = equipSlotList(unit).find(e => e.key === entryKey);
      const item = entry && entry.picked !== undefined && Number(entry.picked) >= 0 ? entry.options[Number(entry.picked)] : null;
      if (!item) { hideGearTooltip(); return; }
      const modIds = liveState[unitId]?.mods?.[entryKey] || [];
      renderTooltip(evt, itemTooltipHTML(item, modIds.map(modById).filter(Boolean)));
    }

    function showModBadgeTooltip(evt, unitId, entryKey) {
      const modIds = liveState[unitId]?.mods?.[entryKey] || [];
      renderTooltip(evt, modBadgeTooltipHTML(modIds.map(modById).filter(Boolean)));
    }

    function renderTooltip(evt, html) {
      let tip = $("gear-tooltip");
      if (!tip) {
        tip = document.createElement("div");
        tip.id = "gear-tooltip";
        tip.className = "gear-tooltip";
        document.body.appendChild(tip);
      }
      tip.innerHTML = html;
      tip.style.display = "block";
      const pad = 14;
      let x = evt.clientX + pad;
      let y = evt.clientY + pad;
      const rect = tip.getBoundingClientRect();
      if (x + rect.width > window.innerWidth) x = evt.clientX - rect.width - pad;
      if (y + rect.height > window.innerHeight) y = evt.clientY - rect.height - pad;
      tip.style.left = `${Math.max(4, x)}px`;
      tip.style.top = `${Math.max(4, y)}px`;
    }

    function hideGearTooltip() {
      const tip = $("gear-tooltip");
      if (tip) tip.style.display = "none";
    }

    function toggleGearDropdown(unitId, idx) {
      const id = `gear-dropdown-${unitId}-${idx}`;
      document.querySelectorAll(".gear-dropdown.open").forEach(el => { if (el.id !== id) el.classList.remove("open"); });
      const el = $(id);
      if (!el) return;
      const opening = !el.classList.contains("open");
      el.classList.toggle("open");
      if (opening) {
        clampDropdownToViewport(el);
        const input = $(`gear-search-${unitId}-${idx}`);
        if (input) {
          input.value = "";
          filterGearDropdown(unitId, idx);
          setTimeout(() => input.focus(), 0);
        }
      }
    }

    function toggleGearGroup(btn) {
      const el = $(btn.dataset.groupTarget);
      if (!el) return;
      el.hidden = !el.hidden;
      btn.innerHTML = `${esc(btn.dataset.label)} (${esc(btn.dataset.count)}) ${el.hidden ? "&#9656;" : "&#9662;"}`;
    }

    function filterGearDropdown(unitId, idx) {
      const dropdown = $(`gear-dropdown-${unitId}-${idx}`);
      const input = $(`gear-search-${unitId}-${idx}`);
      if (!dropdown || !input) return;
      const q = input.value.trim().toLowerCase();
      dropdown.querySelectorAll(".gear-dropdown-item[data-name]").forEach(item => {
        item.style.display = (!q || item.dataset.name.includes(q)) ? "" : "none";
      });
      dropdown.querySelectorAll(".gear-dropdown-group").forEach(group => {
        const toggle = dropdown.querySelector(`.gear-dropdown-group-toggle[data-group-target="${group.id}"]`);
        if (q) {
          const hasMatch = [...group.querySelectorAll(".gear-dropdown-item[data-name]")].some(item => item.style.display !== "none");
          group.hidden = !hasMatch;
          if (toggle) {
            toggle.style.display = hasMatch ? "" : "none";
            toggle.innerHTML = `${esc(toggle.dataset.label)} (${esc(toggle.dataset.count)}) ${hasMatch ? "&#9662;" : "&#9656;"}`;
          }
        } else {
          const collapsed = toggle && toggle.dataset.collapsed === "true";
          group.hidden = !!collapsed;
          if (toggle) {
            toggle.style.display = "";
            toggle.innerHTML = `${esc(toggle.dataset.label)} (${esc(toggle.dataset.count)}) ${collapsed ? "&#9656;" : "&#9662;"}`;
          }
        }
      });
    }

    function selectGear(unitId, attr, attrVal, value) {
      const stateKey = attr === "data-equip" ? "equipment" : "loadout";
      liveState[unitId][stateKey][attrVal] = Number(value);
      saveLiveBuilds();
      document.querySelectorAll(".gear-dropdown.open").forEach(el => el.classList.remove("open"));
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (unit) updateLiveUnit(unit);
    }

    // --- Presets -------------------------------------------------------------
    // 8 buttons rendered under Equipped Gear. Clicking one always opens the popup
    // (never auto-equips) — the popup shows this preset's saved item for every
    // slot the CURRENTLY OPEN unit actually has, using the exact same options
    // list equipSlotList() already computes for live gear, so only valid items
    // ever show up. "Apply" copies matching slots into that unit's live gear via
    // the existing selectGear(); "Clear" wipes the whole preset.
    function presetsHTML(unitId) {
      const buttons = Array.from({ length: PRESET_COUNT }, (_, i) => {
        const filled = Object.keys(presets[i] || {}).length > 0;
        return `<button type="button" class="preset-btn${filled ? " filled" : ""}" title="Preset ${i + 1}${filled ? "" : " (empty)"}" onclick="openPresetPopup(${i}, '${esc(unitId)}')">${i + 1}</button>`;
      }).join("");
      return `<div class="preset-row" id="preset-row-${esc(unitId)}">${buttons}</div>`;
    }

    function refreshPresetButtons(unitId) {
      const row = $(`preset-row-${unitId}`);
      if (row) row.outerHTML = presetsHTML(unitId);
    }

    // Mirrors equipmentIconGrid()'s dropdown/search/group markup so the popup looks
    // and behaves the same as the live gear pickers, but selection writes into the
    // preset (keyed by entry.slot, storing the item's id) instead of into liveState,
    // and there's no mod-badge/tooltip since presets don't track mods.
    function presetEquipHTML(presetIndex, unit) {
      const list = equipSlotList(unit);
      if (!list.length) return `<div class="preset-modal-empty">${esc(unit.name)} has no equipment slots.</div>`;
      const preset = presets[presetIndex] || {};
      const hasMultipleSections = new Set(list.map(e => e.section)).size > 1;
      let lastSection = null;
      const body = list.map((entry, idx) => {
        const sectionHeader = hasMultipleSections && entry.section !== lastSection
          ? `${lastSection !== null ? "</div>" : ""}<div class="equip-section-label">${esc(EQUIP_SECTION_LABELS[entry.section] || "")}</div><div class="equip-slots">`
          : (idx === 0 ? `<div class="equip-slots">` : "");
        lastSection = entry.section;
        const savedId = preset[entry.slot];
        const matchedIdx = savedId !== undefined && savedId !== null ? entry.options.findIndex(o => String(o.id) === String(savedId)) : -1;
        const item = matchedIdx >= 0 ? entry.options[matchedIdx] : null;
        const optionRow = (opt, j) => {
          const bonusText = Object.entries(opt.bonus || {}).map(([rawKey, value]) => `${statIcon(statIdToName[rawKey] || rawKey)}${esc(fmt(value))}`).join(" ");
          return `<div class="gear-dropdown-item ${String(matchedIdx) === String(j) ? "active" : ""}" data-name="${esc((opt.name || "").toLowerCase())}" onclick="selectPresetItem(${presetIndex}, '${esc(unit.id)}', '${esc(entry.slot)}', '${esc(opt.id)}')">${img(opt.icon, "")}<div class="gear-dropdown-text"><strong>${esc(opt.name)}</strong><div class="small">${bonusText || "No bonus captured"}</div></div></div>`;
        };
        let rows;
        if (entry.groups) {
          let j = 0;
          rows = entry.groups.map((group, gIdx) => {
            const groupRows = group.items.map(opt => optionRow(opt, j++)).join("");
            if (!group.label) return groupRows;
            const groupId = `preset-gear-group-${presetIndex}-${idx}-${gIdx}`;
            const collapsed = !!group.collapsedByDefault;
            return `<button type="button" class="gear-dropdown-group-toggle" data-group-target="${groupId}" data-label="${esc(group.label)}" data-count="${group.items.length}" data-collapsed="${collapsed}" onclick="toggleGearGroup(this)">${esc(group.label)} (${group.items.length}) ${collapsed ? "&#9656;" : "&#9662;"}</button>
              <div class="gear-dropdown-group" id="${groupId}" ${collapsed ? "hidden" : ""}>${groupRows}</div>`;
          }).join("");
        } else {
          let j = 0;
          rows = entry.options.map(opt => optionRow(opt, j++)).join("");
        }
        const syntheticUnitId = `preset-${presetIndex}`;
        return `${sectionHeader}<div class="equip-slot">
          <button type="button" class="equip-slot-btn" onclick="toggleGearDropdown('${syntheticUnitId}', '${idx}')">
            <img src="${item ? esc(item.icon) : ""}" style="${item ? "" : "display:none;"}">
            ${item ? "" : `<span class="small">Slot ${esc(entry.slot)}</span>`}
          </button>
          <div class="gear-dropdown" id="gear-dropdown-${syntheticUnitId}-${idx}">
            <input type="text" class="gear-search" id="gear-search-${syntheticUnitId}-${idx}" placeholder="Search equipment…" oninput="filterGearDropdown('${syntheticUnitId}', '${idx}')">
            <div class="gear-dropdown-item ${matchedIdx === -1 ? "active" : ""}" onclick="selectPresetItem(${presetIndex}, '${esc(unit.id)}', '${esc(entry.slot)}', null)">None</div>
            ${rows}
          </div>
        </div>`;
      }).join("");
      return `<div class="preset-slots-wrap">${body}</div></div>`;
    }

    function refreshPresetPopup(presetIndex, unitId) {
      const body = $("preset-popup-body");
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (body && unit) body.innerHTML = presetEquipHTML(presetIndex, unit);
    }

    function selectPresetItem(presetIndex, unitId, slot, itemId) {
      const preset = presets[presetIndex] || (presets[presetIndex] = {});
      if (itemId === null || itemId === undefined) {
        delete preset[slot];
      } else {
        preset[slot] = itemId;
      }
      savePresets();
      document.querySelectorAll(".gear-dropdown.open").forEach(el => el.classList.remove("open"));
      refreshPresetPopup(presetIndex, unitId);
      refreshPresetButtons(unitId);
    }

    function applyPresetToUnit(presetIndex, unitId) {
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (!unit) return;
      const preset = presets[presetIndex] || {};
      equipSlotList(unit).forEach(entry => {
        const itemId = preset[entry.slot];
        if (itemId === undefined || itemId === null) return; // nothing saved for this slot — leave as-is
        const idx = entry.options.findIndex(o => String(o.id) === String(itemId));
        if (idx === -1) return; // item isn't valid for this unit/slot — skip, respecting equipment rules
        selectGear(unitId, entry.attr, entry.attrVal, idx);
      });
    }

    function openPresetPopup(presetIndex, unitId) {
      document.querySelectorAll(".preset-modal-backdrop").forEach(el => el.remove());
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (!unit) return;
      const backdrop = document.createElement("div");
      backdrop.className = "preset-modal-backdrop";
      backdrop.innerHTML = `
        <div class="preset-modal">
          <button type="button" class="compare-modal-close" id="preset-modal-close">&times;</button>
          <div class="compare-modal-title">Preset ${presetIndex + 1} — ${esc(unit.name)}</div>
          <div id="preset-popup-body">${presetEquipHTML(presetIndex, unit)}</div>
          <div class="preset-modal-actions">
            <button type="button" class="btn-under-card" id="preset-apply-btn">Apply to ${esc(unit.name)}</button>
            <button type="button" class="btn-under-card" id="preset-clear-btn">Clear preset</button>
          </div>
        </div>`;
      document.body.appendChild(backdrop);
      const close = () => backdrop.remove();
      backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
      $("preset-modal-close").addEventListener("click", close);
      $("preset-apply-btn").addEventListener("click", () => { applyPresetToUnit(presetIndex, unitId); close(); });
      $("preset-clear-btn").addEventListener("click", () => {
        presets[presetIndex] = {};
        savePresets();
        refreshPresetPopup(presetIndex, unitId);
        refreshPresetButtons(unitId);
      });
    }

    // Custom Abilities: lets you pin any ability (pulled from the whole roster's
    // ability data, deduped by name) onto any unit's card, purely for planning/
    // reference — it's stored in liveState only, not part of the captured game data.
    function customAbilitiesHTML(unit) {
      const realAbilities = (unit.abilities || []).filter(a => a.icon && a.description);
      return abilityListHTML(unit, realAbilities) + addAbilityLinkHTML(unit, realAbilities);
    }

    function rosterIconRowHTML(unit) {
      const compound = COMPOUND_SQUADS[String(unit.id)];
      if (!compound) return "";
      const selected = liveState[unit.id]?.rosterView;
      const squadBtn = `<button type="button" class="roster-icon-btn ${!selected ? "active" : ""}" title="Squad (combined)" onclick="selectRosterSoldier('${esc(unit.id)}','')">
        ${unitImg(unit, "roster-icon")}
        <span class="roster-icon-label">Squad</span>
      </button>`;
      const soldierBtns = compound.soldiers.map(s => `<button type="button" class="roster-icon-btn ${selected === s.soldier_id ? "active" : ""}" title="${esc(prettifySlug(s.preview))}" onclick="selectRosterSoldier('${esc(unit.id)}','${esc(s.soldier_id)}')">
        <img class="roster-icon" src="https://dl-static-local.islandsville.com/resources/icons/Soldier/${esc(s.preview)}.jpg" loading="lazy" onerror="this.style.display='none'">
        <span class="roster-icon-label">${esc(prettifySlug(s.preview))} &times;${esc(s.count)}</span>
      </button>`).join("");
      return squadBtn + soldierBtns;
    }

    function rosterHTML(unit) {
      const compound = COMPOUND_SQUADS[String(unit.id)];
      if (!compound) return "";
      return `<h3>Squad Roster (${esc(compound.total)} total)</h3>
        <div class="roster-icon-row" id="roster-icon-row-${esc(unit.id)}">${rosterIconRowHTML(unit)}</div>`;
    }

    function selectRosterSoldier(unitId, soldierId) {
      if (!liveState[unitId]) return;
      liveState[unitId].rosterView = soldierId || null;
      const unit = views.units.find(u => String(u.id) === String(unitId));
      if (unit) updateLiveUnit(unit);
    }

    // Research section shown in the side panel, under a unit's abilities.
    // Non-Combat is the same global economy list everywhere; Combat is now
    // also the same full catalog everywhere — every unit's card offers every
    // Combat research entry, not just the ones the raw data happened to tie
    // to that specific unit id. It's a reference/checklist the user ticks off
    // tier by tier while browsing (session-only, resets on reload).
    // Builds the Combat research list for one unit from the raw game-data
    // entries. game.json carries no translated text (only locale keys like
    // "storage:10001:title") so a display name is filled in here from the
    // one thing we *can* trust: the numeric stat each tier actually modifies
    // (e.g. param 17 = HP), giving an honest "HP Upgrade" / "DMG Upgrade"
    // label. NOTE: matching by icon against the unit's own named abilities
    // was tried and dropped — icons like "heal_hp" turned out to be reused
    // across dozens of unrelated researches (shields, debuffs, range boosts
    // all sharing the same icon), so it produced confidently wrong names.
    // Entries with no stat param at all (roughly half of them) are shown as
    // "Unnamed Perk" — their real effect isn't recoverable from this data.
    // NOTE: the raw game data ties each entry to a specific owning unit (r.units) —
    // that per-unit lock is intentionally NOT applied here, so every unit's Research
    // panel offers the full Combat research catalog rather than only the handful of
    // entries the original data happened to assign to that exact unit.
    function combatResearchForUnit(unit) {
      return COMBAT_RESEARCH
        .map(r => {
          const icon = data.ability_icons?.[r.view] || r.view;
          const firstStatTier = r.tiers.find(t => (t.p || []).length);
          const name = firstStatTier ? `${firstStatTier.p.map(p => statIdToName[p] || `Stat ${p}`).join("/")} Upgrade` : "Unnamed Perk";
          const tiers = r.tiers.map(t => {
            let text = "";
            if ((t.p || []).length && t.val !== null && t.val !== undefined) {
              const statNames = t.p.map(p => statIdToName[p] || `Stat ${p}`).join("/");
              const sign = typeof t.val === "number" && t.val > 0 ? "+" : "";
              text = `${sign}${t.val} ${statNames}`;
            }
            return { tier: t.t, text, val: t.val, params: t.p || [] };
          });
          return { id: `combat-research-${r.id}`, name, icon, blurb: firstStatTier ? "" : "Effect not captured in the data — icon shown for reference only.", tiers, group: "combat" };
        });
    }

    // Sums the stat bonus from every ticked research tier for a unit, keyed by
    // the same stat names computedStats() uses (so it can just be added in).
    // A tier's val is the *total* effect at that level, not incremental — so
    // this uses the val of the highest ticked tier only, not a running sum
    // across tiers.
    function researchStatBonuses(unit) {
      const bonuses = {};
      combatResearchForUnit(unit).forEach(item => {
        const level = researchState[item.id] || 0;
        if (!level) return;
        const tier = item.tiers.find(t => t.tier === level);
        if (!tier || tier.val === null || tier.val === undefined || !tier.params.length) return;
        tier.params.forEach(p => {
          const stat = statIdToName[p] || `Stat ${p}`;
          bonuses[stat] = Number(bonuses[stat] || 0) + Number(tier.val);
        });
      });
      return bonuses;
    }

    function researchTierRowHTML(item, level, t) {
      const checked = t.tier <= level;
      return `<label class="research-tier-row ${checked ? "checked" : ""}">
        <input type="checkbox" ${checked ? "checked" : ""} onchange="setResearchTier('${esc(item.id)}', ${t.tier}, this.checked)">
        <span class="research-tier-label">T${t.tier}</span>
        <span class="research-tier-text">${esc(t.text || `Tier ${t.tier}`)}</span>
      </label>`;
    }

    function researchItemHTML(item) {
      const level = researchState[item.id] || 0;
      return `<div class="research-item">
        <span class="research-item-icon">${img(item.icon, "thumb")}</span>
        <div>
          <span class="research-item-name">${esc(item.name)}</span>
          ${item.blurb ? `<p class="research-item-blurb">${esc(item.blurb)}</p>` : ""}
          ${item.tiers.map(t => researchTierRowHTML(item, level, t)).join("")}
        </div>
      </div>`;
    }

    function researchGroupHTML(label, items) {
      const collapsed = !!researchGroupCollapsed[label];
      const rows = items.length ? items.map(researchItemHTML).join("") : `<div class="research-empty">No tiered research data captured for this unit/category.</div>`;
      return `<div class="group-section ${collapsed ? "collapsed" : ""}" data-research-group="${esc(label)}">
        <div class="group-header research-group-header" data-research-group="${esc(label)}">
          <span class="group-toggle">${collapsed ? "▶" : "▼"}</span><span>${esc(label)} (${items.length})</span>
        </div>
        <div class="group-rows">${rows}</div>
      </div>`;
    }

    function researchSectionHTML(unit) {
      const combat = combatResearchForUnit(unit);
      return `<h3>Research</h3>
        <div class="research-section" id="research-section" data-research-unit="${esc(unit.id)}">
          ${researchGroupHTML("Combat", combat)}
          ${researchGroupHTML("Non-Combat", NONCOMBAT_RESEARCH_ITEMS)}
        </div>`;
    }

    function attachResearchGroupToggles() {
      document.querySelectorAll(".research-group-header").forEach(header => {
        header.addEventListener("click", () => {
          const label = header.dataset.researchGroup;
          researchGroupCollapsed[label] = !researchGroupCollapsed[label];
          const section = header.closest(".group-section");
          section.classList.toggle("collapsed", researchGroupCollapsed[label]);
          section.querySelector(".group-toggle").textContent = researchGroupCollapsed[label] ? "▶" : "▼";
        });
      });
    }

    // Clicking tier N ticks tiers 1..N and unticks anything above; unticking
    // tier N drops the level to N-1. Standard "fill up to here" tier behavior.
    function setResearchTier(itemId, tier, checked) {
      researchState[itemId] = checked ? tier : tier - 1;
      const section = $("research-section");
      if (!section) return;
      const unit = views.units.find(u => String(u.id) === String(section.dataset.researchUnit));
      const combat = unit ? combatResearchForUnit(unit) : [];
      section.innerHTML = researchGroupHTML("Combat", combat) + researchGroupHTML("Non-Combat", NONCOMBAT_RESEARCH_ITEMS);
      attachResearchGroupToggles();
      if (unit) updateLiveUnit(unit);
    }

    function abilityListHTML(unit, realAbilities) {
      const list = liveState[unit.id]?.customAbilities || [];
      const realRows = realAbilities.map((ability, idx) => {
        const override = liveState[unit.id]?.realAbilityOverrides?.[idx];
        const name = override?.name ?? ability.name;
        const description = override?.description ?? (ability.description || "");
        return `<div class="combat-ability real-ability-row editable-stat" title="Click to edit name/text" onclick="openAbilityEditPopup('${esc(unit.id)}','${idx}','real')">${img(ability.icon, "")}<div><strong>${esc(name)}</strong><p>${esc(description)}</p></div></div>`;
      }).join("");
      const customRows = list.map((val, idx) => {
        const ability = val >= 0 ? ALL_ABILITIES[val] : null;
        if (!ability) return "";
        const override = liveState[unit.id]?.customAbilityOverrides?.[idx];
        const name = override?.name ?? ability.name;
        const description = override?.description ?? (ability.description || "");
        return `<div class="combat-ability custom-ability-row">
          <button type="button" style="all:unset;cursor:pointer;display:block;width:64px;height:64px;" onclick="toggleGearDropdown('${esc(unit.id)}', 'ability-${idx}')">
            <img src="${esc(ability.icon)}">
          </button>
          <div class="editable-stat" title="Click to edit name/text" onclick="event.stopPropagation();openAbilityEditPopup('${esc(unit.id)}','${idx}')">
            <strong>${esc(name)}</strong>
            <p>${esc(description)}</p>
          </div>
          <button type="button" class="custom-ability-remove" title="Remove" onclick="selectAbility('${esc(unit.id)}','${idx}',-1)">&times;</button>
          ${abilityDropdownHTML(unit, realAbilities, idx, val)}
        </div>`;
      }).join("");
      const rows = realRows + customRows;
      return rows ? `<div class="combat-rule"></div>${rows}` : "";
    }

    function abilityDropdownHTML(unit, realAbilities, idx, pickedValue) {
      const ownNames = new Set(realAbilities.map(a => a.name));
      const options = ALL_ABILITIES.map((ab, j) => ({ ab, j })).filter(({ ab, j }) => j === pickedValue || !ownNames.has(ab.name));
      const rows = options.map(({ ab, j }) => `<div class="gear-dropdown-item ${String(pickedValue) === String(j) ? "active" : ""}" data-name="${esc((ab.name || "").toLowerCase())}" onclick="selectAbility('${esc(unit.id)}','${idx}',${j})">${img(ab.icon, "")}<div class="gear-dropdown-text"><strong>${esc(ab.name)}</strong>${ab.description ? `<div class="small">${esc(ab.description)}</div>` : ""}</div></div>`).join("");
      return `<div class="gear-dropdown" id="gear-dropdown-${esc(unit.id)}-ability-${idx}">
        <input type="text" class="gear-search" id="gear-search-${esc(unit.id)}-ability-${idx}" placeholder="Search abilities…" oninput="filterGearDropdown('${esc(unit.id)}', 'ability-${idx}')">
        ${rows}
      </div>`;
    }

    function addAbilityLinkHTML(unit, realAbilities) {
      return `<div class="custom-ability-add equip-slot">
        <button type="button" class="custom-ability-add-link" onclick="toggleGearDropdown('${esc(unit.id)}', 'ability-new')">+ Add ability</button>
        ${abilityDropdownHTML(unit, realAbilities, "new", -1)}
      </div>`;
    }

    function refreshCustomAbilities(unit) {
      const realAbilities = (unit.abilities || []).filter(a => a.icon && a.description);
      const listEl = $(`ability-list-${unit.id}`);
      if (listEl) listEl.innerHTML = abilityListHTML(unit, realAbilities);
      const addEl = $(`custom-abilities-${unit.id}`);
      if (addEl) addEl.innerHTML = addAbilityLinkHTML(unit, realAbilities);
    }

    function selectAbility(unitId, idx, value) {
      const unitState = liveState[unitId];
      if (!unitState) return;
      if (!unitState.customAbilities) unitState.customAbilities = [];
